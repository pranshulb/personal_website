<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <title>things i like — pranshul's cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Princess+Sofia&family=Unkempt:wght@400;700&display=block" rel="stylesheet">
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection {
      background: #f2d0c0;
      color: #3a2f2f;
    }

    body {
      font-family: 'Fraunces', Georgia, serif;
      min-height: 100vh;
      color: #3a2f2f;
      background: #faf5ef;
      overflow-x: hidden;
      position: relative;
    }


    .back {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      font-size: 0.9rem;
      color: #b09a8a;
      text-decoration: none;
      border-bottom: none;
      z-index: 10;
      transition: color 0.3s ease;
    }
    .back:hover { color: #3a2f2f; }

    h1 {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      font-weight: 400;
      color: #3a2f2f;
      z-index: 10;
      font-family: 'Fraunces', Georgia, serif;
      letter-spacing: 0.02em;
    }

    .hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #c4b0a0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      letter-spacing: 0.05em;
      z-index: 10;
      opacity: 0;
      animation: hintFade 6s ease 3s forwards;
      pointer-events: none;
    }

    @keyframes hintFade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    .field {
      position: relative;
      width: 100%;
      min-height: 100vh;
    }

    /* the page remembers being rearranged: every word leaves a faint print
       of itself wherever it has been dragged, on a canvas under the words */
    #ink {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: multiply;
    }
    /* the water the words float on: rings drawn each frame, over the ink,
       under the words */
    #water {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .thing {
      position: absolute;
      left: 0; top: 0;
      cursor: grab;
      will-change: transform;
      z-index: 2;
      user-select: none;
      -webkit-user-select: none;
      text-decoration: none;
      border-bottom: none;
      opacity: 0;
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1), text-shadow 0.45s ease;
      text-shadow: 0 0 0 rgba(58,47,47,0);
    }
    .thing.in { opacity: 1; }
    .thing:hover, .thing.dragging {
      text-shadow: 0 10px 22px rgba(58,47,47,0.14);
    }

    a.thing:hover {
      text-decoration-color: currentColor;
      border-bottom: 1px solid currentColor;
    }

    .thing:active {
      cursor: grabbing;
    }

    .thing.dragging {
      z-index: 50;
      cursor: grabbing;
    }

    /* vignette edges */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background:
        radial-gradient(ellipse 80% 70% at 50% 50%, transparent 55%, rgba(180,140,90,0.06) 100%),
        radial-gradient(circle at 0% 0%, rgba(180,130,60,0.04) 0%, transparent 30%),
        radial-gradient(circle at 100% 100%, rgba(180,130,60,0.04) 0%, transparent 30%);
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d4bfb0; border-radius: 3px; }

    .epigraph {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      font-size: 0.85rem;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      color: #c4a0a0;
      letter-spacing: 0.03em;
      margin: 0;
      z-index: 10;
    }

    @media (max-width: 640px) {
      /* the title sits under the back link and the epigraph, not across them */
      body h1 { font-size: 1.5rem !important; top: 3rem; white-space: nowrap; }
      .epigraph { font-size: 0.7rem; top: 1.1rem; right: 1rem; }
      .back { top: 1rem; left: 1rem; }
      .hint { font-size: 0.65rem; bottom: 1rem; }
    }

    /* the home page's paper grain */
    .grain {
      position: fixed; top: -50%; left: -50%;
      width: 200%; height: 200%;
      pointer-events: none; z-index: 8; opacity: 0.12;
    }
  </style>
  <script defer src="https://analytics.pranshul.cafe/script.js" data-website-id="fd5100ed-c3c1-4ee0-a84c-9cdf3feaaf1f"></script>

<style id="enola-font-override">
  body, body *{font-family:'Unkempt',cursive !important;}
  body h1, body h1 *, body .title{font-family:'Princess Sofia',cursive !important;font-weight:400 !important;font-size:2.2rem !important;}
</style>
</head>
<body>

<a href="/" class="back">← back</a>
<h1>things i like</h1>
<p class="epigraph"><em>cherry blossoms fall at 5 centimeters per second.</em></p>
<div class="vignette"></div>

<div class="field" id="field"><canvas id="ink"></canvas><canvas id="water"></canvas></div>

<script>
  const things = [
    { text: "apricity", style: "serif", url: "https://www.merriam-webster.com/wordplay/winter-words" },
    { text: "the humans", style: "book", url: "https://www.goodreads.com/book/show/16130537-the-humans" },
    { text: "the name of the wind", style: "book", url: "https://www.goodreads.com/book/show/186074.The_Name_of_the_Wind" },
    { text: "eragon", style: "book", url: "https://www.goodreads.com/book/show/113436.Eragon" },
    { text: "manchester by the sea", style: "film", url: "https://letterboxd.com/film/manchester-by-the-sea/" },

    { text: "exurb1a", style: "wild", url: "https://www.youtube.com/@Exurb1a" },
    { text: "green", style: "color", url: "/shrek" },
    { text: "two men contemplating the moon", style: "painting", url: "/things-i-like/two-men-contemplating-the-moon" },
    { text: "charles bukowski", style: "book", url: "https://www.poetryfoundation.org/poets/charles-bukowski" },
  ];

  const isMobile = window.innerWidth < 640;
  const s = isMobile ? 0.7 : 1;

  const styles = {
    serif: (el) => {
      el.style.fontFamily = "'Cormorant Garamond', Georgia, serif";
      el.style.fontWeight = "300";
      el.style.fontStyle = "italic";
      el.style.fontSize = ((2.2 + Math.random() * 1.2) * s) + "rem";
      el.style.color = "#c47a7a";
      el.style.letterSpacing = "0.06em";
    },
    book: (el) => {
      el.style.fontFamily = "'Fraunces', Georgia, serif";
      const w = [200, 300, 400][Math.floor(Math.random() * 3)];
      el.style.fontWeight = w;
      el.style.fontStyle = Math.random() > 0.5 ? "italic" : "normal";
      el.style.fontSize = ((1.1 + Math.random() * 0.8) * s) + "rem";
      el.style.color = "#5a4a40";
    },
    film: (el) => {
      el.style.fontFamily = "'Cormorant Garamond', Georgia, serif";
      el.style.fontWeight = "400";
      el.style.fontSize = ((1.15 + Math.random() * 0.7) * s) + "rem";
      el.style.color = "#7a6a5f";
      el.style.letterSpacing = "0.04em";
    },
    wild: (el) => {
      el.style.fontFamily = "'Fraunces', Georgia, serif";
      el.style.fontWeight = "600";
      el.style.fontSize = ((1.8 + Math.random() * 1) * s) + "rem";
      el.style.color = "#3a2f2f";
      el.style.fontVariationSettings = "'SOFT' 100, 'WONK' 1";
    },
    color: (el) => {
      el.style.fontFamily = "'Fraunces', Georgia, serif";
      el.style.fontWeight = "300";
      el.style.fontSize = ((1.4 + Math.random() * 0.6) * s) + "rem";
      el.style.color = "#5a7a5a";
      el.style.fontStyle = "italic";
      el.style.letterSpacing = "0.1em";
    },
    painting: (el) => {
      el.style.fontFamily = "'Cormorant Garamond', Georgia, serif";
      el.style.fontWeight = "300";
      el.style.fontStyle = "italic";
      el.style.fontSize = ((1.25 + Math.random() * 0.5) * s) + "rem";
      el.style.color = "#5a6a7a";
      el.style.letterSpacing = "0.03em";
    }
  };

  // shuffle
  for (let i = things.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [things[i], things[j]] = [things[j], things[i]];
  }

  /* ================================================================
     MOTION

     Every word is moved by one animation loop rather than its own CSS
     keyframe animation, which is what made the old page feel busy: nine
     words each hitting the corners of a four-stop keyframe on their own
     clock. Here each word has a resting place and floats about it on two
     slow sine waves, like paper on still water. Nothing is ever set
     through left/top after layout: position is a translate, so a move is
     a compositor job, not a re-layout.

     A dragged word follows the finger through a spring, so it trails a
     little and catches up; it leans into the direction it is moving and
     rights itself when it stops. Let go and it keeps its speed and glides
     to rest. Words it is pushed into make room and stay where they were
     nudged. The ink under it is stamped along the eased path, so the
     trail is a curve rather than a stutter.

     The words sit on water. Under them is a second canvas where rings
     spread and fade, drawn with a hand's wobble like the pool on the home
     page: one when the pointer arrives on a word, a wake behind a word
     being dragged, a splash where it is let go, and a small one under a
     finger. A ring passing under another word bobs it, so a drag sends a
     shiver through the neighbours.
  ================================================================ */
  const field = document.getElementById('field');
  const words = [];        // { el, x, y, vx, vy, w, h, rot, lean, lift, hot, born, f1, f2, p1, p2, amp }
  const placed = [];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const easeOut = k => 1 - Math.pow(1 - k, 3);

  things.forEach((item, idx) => {
    const el = document.createElement(item.url ? 'a' : 'span');
    el.className = 'thing';
    el.textContent = item.text;
    el.dataset.idx = idx;
    if (item.url) {
      el.href = item.url;
      el.target = '_blank';
      el.rel = 'noopener';
    }
    styles[item.style](el);
    field.appendChild(el);

    // on mobile, constrain width so long titles wrap within screen
    if (isMobile) {
      el.style.maxWidth = (window.innerWidth - 40) + 'px';
      el.style.whiteSpace = 'normal';
    }

    const w = el.offsetWidth, h = el.offsetHeight;
    const padX = isMobile ? 15 : 60;
    const maxX = Math.max(field.clientWidth - w - padX, padX);
    const topMin = isMobile ? 120 : 110;
    const maxY = Math.max(window.innerHeight - (isMobile ? 120 : 180), 350);

    let x, y, tries = 0, ok = false;
    while (tries < 150) {
      x = padX + Math.random() * Math.max(maxX, 100);
      y = topMin + Math.random() * (maxY - topMin);
      ok = true;
      const gapX = isMobile ? 15 : 30;
      const gapY = isMobile ? 8 : 15;
      for (const p of placed) {
        if (Math.abs(x - p.x) < (Math.max(w, p.w) + gapX) &&
            Math.abs(y - p.y) < (Math.max(h, p.h) + gapY)) {
          ok = false; break;
        }
      }
      if (ok) break;
      tries++;
    }
    placed.push({ x, y, w, h });

    const rot = -3.5 + Math.random() * 7;
    const word = {
      el, x, y, vx: 0, vy: 0, w, h, rot, lean: 0, lift: 0, hot: false,
      born: performance.now() + 250 + idx * 170,
      bob: 0, bobV: 0,
      f1: 0.3 + Math.random() * 0.2, f2: 0.12 + Math.random() * 0.1,
      p1: Math.random() * Math.PI * 2, p2: Math.random() * Math.PI * 2,
      amp: (isMobile ? 3 : 4.5) + Math.random() * 2
    };
    el._word = word;
    words.push(word);
    place(word, 0);
    el.addEventListener('mouseenter', () => {
      word.hot = true;
      word.bobV -= 0.7;
      const cx = word.x + word.w / 2, cy = word.y + word.h / 2;
      ripple(cx, cy, word.w * 0.6 + 50, 170, 0.22);
      setTimeout(() => ripple(cx, cy, word.w * 0.45 + 34, 150, 0.14), 220);
    });
    el.addEventListener('mouseleave', () => { word.hot = false; });
  });

  function place(q, t) {
    const age = clamp((performance.now() - q.born) / 1100, 0, 1);
    if (age > 0 && !q.el.classList.contains('in')) q.el.classList.add('in');
    const rise = (1 - easeOut(age)) * 14;
    const fx = Math.sin(t * q.f1 + q.p1) * q.amp + Math.sin(t * q.f2 + q.p2) * q.amp * 0.5;
    const fy = Math.cos(t * q.f1 * 0.8 + q.p2) * q.amp * 0.7 + Math.sin(t * q.f2 * 1.3 + q.p1) * q.amp * 0.3 + q.bob;
    const wob = Math.sin(t * q.f1 * 0.9 + q.p1) * 0.4 + Math.sin(t * q.f2 + q.p2) * 0.2;
    const sc = 1 + q.lift * 0.035;
    q.el.style.transform = `translate3d(${(q.x + fx).toFixed(2)}px, ${(q.y + fy + rise).toFixed(2)}px, 0) rotate(${(q.rot + wob + q.lean).toFixed(2)}deg) scale(${sc.toFixed(3)})`;
  }

  // Two words are too close when their boxes, grown by a margin, overlap.
  // The one being dragged has right of way; the other is nudged along the
  // line between their centres, by a share of the overlap each frame, so
  // it slides aside rather than jumping.
  function makeRoom(d) {
    const m = 14;
    for (const q of words) {
      if (q === d) continue;
      const ox = (d.w + q.w) / 2 + m - Math.abs((d.x + d.w / 2) - (q.x + q.w / 2));
      const oy = (d.h + q.h) / 2 + m - Math.abs((d.y + d.h / 2) - (q.y + q.h / 2));
      if (ox <= 0 || oy <= 0) continue;
      const sx = Math.sign((q.x + q.w / 2) - (d.x + d.w / 2)) || 1;
      const sy = Math.sign((q.y + q.h / 2) - (d.y + d.h / 2)) || 1;
      if (ox < oy) q.vx += sx * ox * 0.09; else q.vy += sy * oy * 0.09;
    }
  }

  // --- WATER ---
  const waterEl = document.getElementById('water');
  const waterC = waterEl.getContext('2d');
  let rings = [];          // { x, y, r, maxR, age, life, a, ph, hit:Set }
  let wakeDist = 0, wakeX = 0, wakeY = 0;

  function ripple(x, y, maxR, life, a) {
    if (rings.length > 80) rings.shift();
    rings.push({ x, y, maxR, age: 0, life, a, ph: Math.random() * Math.PI * 2, hit: new Set() });
  }

  function wobblyRing(c, x, y, r, ph, color) {
    c.strokeStyle = color;
    c.beginPath();
    for (let i = 0; i <= 44; i++) {
      const a = i / 44 * Math.PI * 2;
      const rr = r * (1 + 0.05 * Math.sin(3 * a + ph) + 0.035 * Math.sin(5 * a - ph * 1.3));
      const X = x + Math.cos(a) * rr, Y = y + Math.sin(a) * rr * 0.55;
      i ? c.lineTo(X, Y) : c.moveTo(X, Y);
    }
    c.closePath();
    c.stroke();
  }

  function updateWater() {
    for (let i = rings.length - 1; i >= 0; i--) {
      const g = rings[i];
      if (++g.age > g.life) { rings.splice(i, 1); continue; }
      const k = g.age / g.life;
      g.r = 2 + (g.maxR - 2) * (1 - Math.pow(1 - k, 2));
      // a ring reaching a word lifts it a little, once
      for (const q of words) {
        if (g.hit.has(q) || (dragEl && dragEl._word === q)) continue;
        const d = Math.hypot(q.x + q.w / 2 - g.x, (q.y + q.h / 2 - g.y) / 0.55);
        if (Math.abs(d - g.r) < 14) { g.hit.add(q); q.bobV -= 2.2 * g.a * (1 - k * 0.6); }
      }
    }
    const c = waterC;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, inkW, inkH);
    c.lineCap = 'round';
    for (const g of rings) {
      const k = g.age / g.life;
      const a = g.a * Math.pow(1 - k, 1.6);
      if (a < 0.01) continue;
      c.lineWidth = 1.0 - k * 0.5;
      wobblyRing(c, g.x, g.y, g.r, g.ph, `rgba(96, 112, 148, ${a})`);
      if (g.r > 10) { c.lineWidth = 0.7; wobblyRing(c, g.x, g.y, g.r * 0.6, g.ph + 1.7, `rgba(96, 112, 148, ${a * 0.45})`); }
    }
  }

  let dragEl = null, dragOffX = 0, dragOffY = 0, hasDragged = false;
  let startX = 0, startY = 0, tgtX = 0, tgtY = 0;
  const DRAG_THRESHOLD = 5;

  function tick(now) {
    const t = now / 1000;
    const fw = field.clientWidth, fh = Math.max(field.clientHeight, window.innerHeight);
    for (const q of words) {
      const dragging = dragEl && dragEl._word === q && hasDragged;
      if (dragging) {
        const nx = q.x + (tgtX - q.x) * 0.28, ny = q.y + (tgtY - q.y) * 0.28;
        q.vx = nx - q.x; q.vy = ny - q.y;
        q.x = nx; q.y = ny;
        makeRoom(q);
        inkAlong(q.x, q.y);
        // a wake: small rings every so often along the way
        const sp = Math.hypot(q.vx, q.vy);
        wakeDist += sp;
        if (sp > 0.8 && wakeDist > 44) {
          wakeDist = 0;
          ripple(q.x + q.w / 2 + (Math.random() - 0.5) * q.w * 0.5, q.y + q.h / 2, 12 + Math.min(sp, 14) * 1.4, 100, 0.13);
        }
      } else {
        q.x += q.vx; q.y += q.vy;
        q.vx *= 0.90; q.vy *= 0.90;
        // soft walls: a word that slides off the field is eased back in
        const minX = 8, maxX = fw - q.w - 8, minY = 8, maxY = fh - q.h - 8;
        if (q.x < minX) q.vx += (minX - q.x) * 0.08;
        if (q.x > maxX) q.vx += (maxX - q.x) * 0.08;
        if (q.y < minY) q.vy += (minY - q.y) * 0.08;
        if (q.y > maxY) q.vy += (maxY - q.y) * 0.08;
        if (Math.abs(q.vx) < 0.01) q.vx = 0;
        if (Math.abs(q.vy) < 0.01) q.vy = 0;
        if (glideInk === q) {
          if (Math.hypot(q.vx, q.vy) > 0.4) inkAlong(q.x, q.y); else { glideInk = null; stamp = null; }
        }
      }
      const leanTo = clamp(q.vx * 1.0, -4, 4);
      q.lean += (leanTo - q.lean) * (dragging ? 0.18 : 0.10);
      const liftTo = (dragging || q.hot) ? 1 : 0;
      q.lift += (liftTo - q.lift) * 0.12;
      // the bob: a spring back to level, so a ring or a hover rocks the word
      q.bobV += -q.bob * 0.04; q.bobV *= 0.92; q.bob += q.bobV;
      place(q, t);
    }
    updateWater();
    requestAnimationFrame(tick);
  }

  // --- INK ---
  // The words are HTML and the browser paints them; we can't smudge them
  // directly. Instead, when a drag starts, the word is painted once more —
  // same text, same font, same colour, wrapped the way the browser wrapped
  // it — into a small scratch canvas: a rubber stamp of the word. While it
  // moves, that stamp is pressed onto the ink canvas every few pixels
  // along the path at a very low opacity, so slow or repeated moves darken
  // and a quick flick leaves only a breath. The ink stays for the visit.
  const inkEl = document.getElementById('ink');
  const inkC = inkEl.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let inkW = 0, inkH = 0;
  const STAMP_EVERY = 22;  // px of travel between prints: far enough apart that each echo of the word stays readable
  const STAMP_ALPHA = 0.07;

  function sizeInk() {
    const w = field.clientWidth, h = field.clientHeight;
    if (w === inkW && h === inkH) return;
    // keep what has been drawn: copy the old ink onto the new size
    let old = null;
    if (inkW && inkH) {
      old = document.createElement('canvas');
      old.width = inkEl.width; old.height = inkEl.height;
      old.getContext('2d').drawImage(inkEl, 0, 0);
    }
    inkW = w; inkH = h;
    inkEl.width = Math.ceil(w * dpr); inkEl.height = Math.ceil(h * dpr);
    inkEl.style.width = w + 'px'; inkEl.style.height = h + 'px';
    waterEl.width = inkEl.width; waterEl.height = inkEl.height;
    waterEl.style.width = w + 'px'; waterEl.style.height = h + 'px';
    if (old) inkC.drawImage(old, 0, 0);
  }
  sizeInk();
  window.addEventListener('resize', sizeInk);

  let stamp = null, lastStampX = 0, lastStampY = 0, glideInk = null;

  function buildStamp(el) {
    const cs = getComputedStyle(el);
    const w = el.offsetWidth, h = el.offsetHeight;   // the box before its rotation
    if (!w || !h) return null;
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * dpr); c.height = Math.ceil(h * dpr);
    const x = c.getContext('2d');
    x.scale(dpr, dpr);
    x.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    if ('letterSpacing' in x) x.letterSpacing = cs.letterSpacing;
    x.fillStyle = cs.color;
    x.textBaseline = 'alphabetic';
    // wrap the way the browser did: greedily at spaces, against the box width
    const lines = []; let cur = '';
    for (const wd of el.textContent.split(' ')) {
      const t = cur ? cur + ' ' + wd : wd;
      if (cur && x.measureText(t).width > w + 0.5) { lines.push(cur); cur = wd; } else cur = t;
    }
    if (cur) lines.push(cur);
    const m = x.measureText('Hg');
    const fs = parseFloat(cs.fontSize);
    const asc = m.fontBoundingBoxAscent || fs * 0.8;
    const desc = m.fontBoundingBoxDescent || fs * 0.2;
    const padL = parseFloat(cs.paddingLeft) || 0, padT = parseFloat(cs.paddingTop) || 0;
    const lineH = (h - padT - (parseFloat(cs.paddingBottom) || 0)) / lines.length;
    lines.forEach((ln, i) => x.fillText(ln, padL, padT + i * lineH + (lineH - asc - desc) / 2 + asc));
    return { c, w, h, rot: (el._word ? el._word.rot : 0) * Math.PI / 180 };
  }

  function pressStamp(x, y) {
    if (!stamp) return;
    inkC.save();
    inkC.setTransform(dpr, 0, 0, dpr, 0, 0);
    inkC.globalAlpha = STAMP_ALPHA;
    inkC.translate(x + stamp.w / 2, y + stamp.h / 2);
    inkC.rotate(stamp.rot);
    inkC.drawImage(stamp.c, -stamp.w / 2, -stamp.h / 2, stamp.w, stamp.h);
    inkC.restore();
  }

  // Press along the whole segment since the last print, so a fast drag
  // leaves a continuous (if faint) trail rather than dashes.
  function inkAlong(x, y) {
    if (!stamp) return;
    const dx = x - lastStampX, dy = y - lastStampY;
    const dist = Math.hypot(dx, dy);
    if (dist < STAMP_EVERY) return;
    const n = Math.min(60, Math.floor(dist / STAMP_EVERY));
    for (let i = 1; i <= n; i++) pressStamp(lastStampX + dx * i / n, lastStampY + dy * i / n);
    lastStampX = x; lastStampY = y;
  }

  // --- DRAG ---
  function startDrag(el, clientX, clientY) {
    const q = el._word;
    dragEl = el;
    hasDragged = false;
    startX = clientX;
    startY = clientY;
    const fieldRect = field.getBoundingClientRect();
    dragOffX = clientX - fieldRect.left - q.x;
    dragOffY = clientY - fieldRect.top - q.y;
    tgtX = q.x; tgtY = q.y;
    q.vx = 0; q.vy = 0;
    el.classList.add('dragging');
    glideInk = null;
    stamp = null;
    try { stamp = buildStamp(el); } catch (err) { stamp = null; }
    lastStampX = q.x;
    lastStampY = q.y;
    wakeDist = 0;
    q.bobV -= 0.5;
    ripple(q.x + q.w / 2, q.y + q.h / 2, q.w * 0.5 + 30, 130, 0.18);
  }

  function moveDrag(clientX, clientY) {
    if (!dragEl) return;
    const dist = Math.hypot(clientX - startX, clientY - startY);
    if (dist > DRAG_THRESHOLD) hasDragged = true;
    if (!hasDragged) return;
    const fieldRect = field.getBoundingClientRect();
    tgtX = clientX - fieldRect.left - dragOffX;
    tgtY = clientY - fieldRect.top - dragOffY;
  }

  function endDrag() {
    if (!dragEl) return;
    const q = dragEl._word;
    dragEl.classList.remove('dragging');
    // it keeps the speed it had and glides to rest where it lands
    q.vx = clamp(q.vx * 1.6, -18, 18); q.vy = clamp(q.vy * 1.6, -18, 18);
    glideInk = hasDragged ? q : null;
    if (hasDragged) {
      // the splash: bigger the faster it was going
      const sp = Math.hypot(q.vx, q.vy);
      const cx = q.x + q.w / 2, cy = q.y + q.h / 2;
      ripple(cx, cy, q.w * 0.7 + 60 + sp * 5, 190, 0.26);
      setTimeout(() => ripple(cx, cy, q.w * 0.5 + 40 + sp * 3, 160, 0.16), 220);
      q.bobV += 0.9;
    }
    dragEl = null;
  }

  // a finger or a click on the water itself: a ring where it touched
  field.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.thing')) return;
    const r = field.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    ripple(x, y, 64, 160, 0.2);
    setTimeout(() => ripple(x, y, 44, 140, 0.12), 220);
  });

  // prevent native <a> clicks — we handle navigation manually
  field.addEventListener('click', (e) => {
    if (e.target.closest('.thing')) e.preventDefault();
  });

  // mouse
  field.addEventListener('mousedown', (e) => {
    const el = e.target.closest('.thing');
    if (!el) return;
    e.preventDefault();
    startDrag(el, e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
  window.addEventListener('mouseup', (e) => {
    if (dragEl && !hasDragged && dragEl.href) {
      window.open(dragEl.href, '_blank');
    }
    endDrag();
  });

  // touch
  field.addEventListener('touchstart', (e) => {
    const el = e.target.closest('.thing');
    if (!el) return;
    const t = e.touches[0];
    startDrag(el, t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (!dragEl) return;
    e.preventDefault();
    const t = e.touches[0];
    moveDrag(t.clientX, t.clientY);
  }, { passive: false });
  window.addEventListener('touchend', (e) => {
    if (dragEl && !hasDragged && dragEl.href) {
      window.open(dragEl.href, '_blank');
    }
    endDrag();
  });

  requestAnimationFrame(tick);

</script>
<svg class="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>
<script defer src="/petals.js"></script>

</body>
</html>
