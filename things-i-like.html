<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <title>things i like — pranshul's cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Princess+Sofia&family=Unkempt:wght@400;700&display=block" rel="stylesheet">
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection {
      background: #f2d0c0;
      color: #3a2f2f;
    }

    body {
      font-family: 'Fraunces', Georgia, serif;
      min-height: 100vh;
      color: #3a2f2f;
      background: #faf5ef;
      overflow-x: hidden;
      position: relative;
    }


    .back {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      font-size: 0.9rem;
      color: #b09a8a;
      text-decoration: none;
      border-bottom: none;
      z-index: 10;
      transition: color 0.3s ease;
    }
    .back:hover { color: #3a2f2f; }

    h1 {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      font-weight: 400;
      color: #3a2f2f;
      z-index: 10;
      font-family: 'Fraunces', Georgia, serif;
      letter-spacing: 0.02em;
    }

    .hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #c4b0a0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      letter-spacing: 0.05em;
      z-index: 10;
      opacity: 0;
      animation: hintFade 6s ease 3s forwards;
      pointer-events: none;
    }

    @keyframes hintFade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    .field {
      position: relative;
      width: 100%;
      min-height: 100vh;
      /* nothing in here may widen the page: a word or a canvas left past
         the edge when a phone turned on its side made the page wider than
         the screen, and turning back, the phone zoomed out to fit it */
      overflow: hidden;
    }

    /* the page remembers being rearranged: every word leaves a faint print
       of itself wherever it has been dragged, on a canvas under the words */
    #ink {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: multiply;
    }
    /* the water the words float on: rings drawn each frame, over the ink,
       under the words */
    #water {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Every word sits in a bubble on the water, always: nearly clear, with
       a thin rim, so it reads as something to press and pick up without
       being a button. Every word is a link. Pointing at one, pressing it,
       carrying it: the bubble brightens a little, squeezes, lifts. */
    .thing {
      position: absolute;
      left: 0; top: 0;
      cursor: grab;
      will-change: transform;
      z-index: 2;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;   /* no link preview on a long press: a long press is a pick-up */
      -webkit-tap-highlight-color: transparent;   /* no grey box flashing over the bubble on a tap */
      touch-action: none;            /* a finger on a word moves the word, not the page */
      text-decoration: none;
      /* room for the bubble inside the word's own box, so placement and
         the nudging of neighbours leave space for it, and the whole bubble
         is something to grab */
      padding: 0.26em 0.62em 0.34em;
      opacity: 0;
      /* the opacity part is set from MOTION.entrance when each word is made */
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .thing.in { opacity: 1; }
    /* each letter is its own box, so a ring passing under the word can lift
       the letters one after another */
    .thing .ch { display: inline-block; will-change: transform; }

    /* The bubble is two layers behind the letters, both filling the
       padding so nothing moves when they change:
       ::before, the body: all but clear, a small patch of light at the top
         left and a fainter one at the bottom right, a shadow barely there;
       ::after, the rim: one thin line whose colour drifts from white to a
         cool blue to a warm pink round the edge, the way a soap film
         catches light, cut out of a filled box with a mask.
       Changing state only fades their opacity and scales them, which the
       compositor does cheaply. No backdrop-filter: nine of them moving over
       two canvases would cost the frame rate the ink work bought back. */
    .thing::before, .thing::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 999px;
      z-index: -1;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 1.4, 0.4, 1), box-shadow 0.4s ease;
    }
    .thing::before {
      background:
        radial-gradient(ellipse 34% 42% at 20% 26%, rgba(255,255,255,0.7), rgba(255,255,255,0) 100%),
        radial-gradient(ellipse 26% 30% at 84% 80%, rgba(255,255,255,0.35), rgba(255,255,255,0) 100%),
        linear-gradient(180deg, rgba(214,230,236,0.10), rgba(214,230,236,0.04));
      box-shadow: 0 3px 10px rgba(58,47,47,0.05);
      opacity: 0.42;
    }
    .thing::after {
      padding: 1px;
      background: linear-gradient(125deg,
        rgba(255,255,255,0.95) 0%, rgba(170,200,214,0.75) 30%,
        rgba(236,190,206,0.6) 58%, rgba(170,200,214,0.7) 80%, rgba(255,255,255,0.9) 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      opacity: 0.45;
    }

    /* pointed at: a little brighter. A real hover only: on a phone :hover
       sticks after a tap. */
    @media (hover: hover) {
      .thing:hover::before { opacity: 1; }
      .thing:hover::after  { opacity: 0.85; }
    }
    .thing:focus-visible { outline: none; }
    .thing:focus-visible::before { opacity: 1; }
    .thing:focus-visible::after  { opacity: 1; background: #c47a7a; }

    /* pressed: the bubble gives a little, like a button */
    .thing.pressed::before, .thing.pressed::after {
      opacity: 1;
      transform: scale(0.96);
      transition-duration: 0.12s;
    }

    /* carried: lifted out of the water, a touch larger, its shadow
       further below */
    .thing.dragging { z-index: 50; cursor: grabbing; }
    .thing.dragging::before {
      opacity: 1;
      transform: scale(1.03);
      box-shadow: 0 10px 24px rgba(58,47,47,0.1);
    }
    .thing.dragging::after { opacity: 0.95; transform: scale(1.03); }

    /* vignette edges */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background:
        radial-gradient(ellipse 80% 70% at 50% 50%, transparent 55%, rgba(180,140,90,0.06) 100%),
        radial-gradient(circle at 0% 0%, rgba(180,130,60,0.04) 0%, transparent 30%),
        radial-gradient(circle at 100% 100%, rgba(180,130,60,0.04) 0%, transparent 30%);
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d4bfb0; border-radius: 3px; }

    .epigraph {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      font-size: 0.85rem;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      color: #c4a0a0;
      letter-spacing: 0.03em;
      margin: 0;
      z-index: 10;
    }

    @media (max-width: 640px) {
      /* the title sits under the back link and the epigraph, not across them */
      body h1 { font-size: 1.5rem !important; top: 3rem; white-space: nowrap; }
      .epigraph { font-size: 0.7rem; top: 1.1rem; right: 1rem; }
      .back { top: 1rem; left: 1rem; }
      .hint { font-size: 0.65rem; bottom: 1rem; }
    }

    /* on an iPhone, the way in to tilting (see TILT in the script): Safari
       only lets a page feel the phone tilt after a tap, so when it refuses
       this offers one, looking like one of the bubbles */
    .tilt-ask {
      position: fixed;
      left: 50%;
      bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 20;
      padding: 0.45em 1.1em 0.5em;
      font-size: 0.85rem;
      color: #9a8575;
      white-space: nowrap;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(170,200,214,0.7);
      border-radius: 999px;
      box-shadow: 0 3px 10px rgba(58,47,47,0.06);
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0s 0.6s;
    }
    .tilt-ask.show { opacity: 1; visibility: visible; transition: opacity 0.6s ease; }

    /* the home page's paper grain */
    .grain {
      position: fixed; top: -50%; left: -50%;
      width: 200%; height: 200%;
      pointer-events: none; z-index: 8; opacity: 0.12;
    }
  </style>

<style id="enola-font-override">
  body, body *{font-family:'Unkempt',cursive !important;}
  body h1, body h1 *, body .title{font-family:'Princess Sofia',cursive !important;font-weight:400 !important;font-size:2.2rem !important;}

<body>

<a href="/" class="back">← back</a>
<h1>things i like</h1>
<p class="epigraph"><em>cherry blossoms fall at 5 centimeters per second.</em></p>
<div class="vignette"></div>

<div class="field" id="field"><canvas id="ink"></canvas><canvas id="water"></canvas></div>
<button class="tilt-ask" id="tiltAsk" type="button">tap here, then tilt your phone</button>

<script>
  const things = [
    { text: "apricity", style: "serif", url: "https://www.merriam-webster.com/wordplay/winter-words" },
    { text: "the humans", style: "book", url: "https://www.goodreads.com/book/show/16130537-the-humans" },
    { text: "the name of the wind", style: "book", url: "https://www.goodreads.com/book/show/186074.The_Name_of_the_Wind" },
    { text: "eragon", style: "book", url: "https://www.goodreads.com/book/show/113436.Eragon" },
    { text: "manchester by the sea", style: "film", url: "https://letterboxd.com/film/manchester-by-the-sea/" },

    { text: "exurb1a", style: "wild", url: "https://www.youtube.com/@Exurb1a" },
    { text: "green", style: "color", url: "/shrek" },
    { text: "two men contemplating the moon", style: "painting", url: "/things-i-like/two-men-contemplating-the-moon", twoLinesOnPhone: true },
    { text: "charles bukowski", style: "book", url: "https://www.poetryfoundation.org/poets/charles-bukowski" },
  ];

  const isMobile = window.innerWidth < 640;
  const s = isMobile ? 0.7 : 1;

  /* ================================================================
     TUNING — how the words move

     Every number that shapes the motion is here. Ranges [a, b] pick a
     value per word at random. Curves are CSS cubic-beziers (four
     numbers) or a name from EASE below. Change and reload.
  ================================================================ */
  const MOTION = {
    // the resting float: two swells added together, in pixels and seconds
    float: {
      amp:      isMobile ? [3, 5] : [4.5, 6.5],   // main swell, px
      swell:    [12, 20],                          // seconds per main swell
      slow:     [30, 50],                          // seconds for the slower one underneath
      rock:     0.4,                               // degrees of rocking either way
    },
    // the entrance: fade in, rising from `rise` px, over `seconds`
    entrance: { rise: 14, seconds: 1.1, ease: 'outExpo', stagger: 0.17 },
    // dragging
    drag: {
      follow:   0.28,   // how much of the gap to the finger closes each frame (1 = rigid)
      leanDeg:  4,      // most it leans into its motion
      leanRate: 0.10,   // how fast the lean settles (per frame)
      glide:    0.90,   // speed kept per frame after release (lower = stops sooner)
      throwing: 1.6,    // release speed multiplier
      lift:     0.035,  // scale added while hovered or held
    },
    // bumping: words are round-ended bubbles that knock into each other
    // and off the edges of the screen, the bigger one shoving the smaller
    bump: {
      bounce:   0.3,    // speed a knock gives back between two words (0 = a dead thud, 1 = a rubber ball)
      edge:     0.3,    // the same, off the edges of the screen
      gap:      isMobile ? 4 : 8,   // px of clear water kept between two bubbles
    },
    // tilting a phone tips the water: the words drift downhill, bump into
    // each other and gather against the low edge. However the phone is
    // held counts as level after a while, so lying down with it doesn't
    // leave every word stuck in one corner. Not too soon: at 4 seconds,
    // tipping the phone left for a few seconds and back made "back" a tip
    // to the right, and the words slid back across
    tilt: {
      strength: 1.0,    // how fast words slide downhill (px per frame gained per frame, at a full tilt)
      settle:   20,     // seconds a held tilt takes to count as level again
      ignore:   3,      // degrees of hand wobble that move nothing
    },
    // the bob: a spring back to level after a dip
    bob: { spring: 0.04, damping: 0.92, hoverDip: 0.7, lifted: 1.2 },
    // the letters: a ring passing under a word lifts each letter as its
    // front goes by, so the word itself ripples. lift in px at full ring
    // strength; width is how wide the ring's front is, in px
    letters: { lift: 6, width: 18 },
    // rings on the water: how far they reach (px, plus a share of the
    // word's width), how long (frames at 60/s), how dark (0..1)
    rings: {
      hover:  { reach: 50, share: 0.60, life: 170, alpha: 0.22, second: 0.65 },
      pickup: { reach: 30, share: 0.50, life: 130, alpha: 0.18 },
      wake:   { reach: 22, life: 150, alpha: 0.2, every: 30 },    // behind a dragged word; every: px between rings
      trail:  { reach: 14, life: 130, alpha: 0.11, every: 56 },   // behind the mouse crossing the water (desktop)
      splash: { reach: 60, share: 0.70, life: 190, alpha: 0.26, second: 0.62 },
      tap:    { reach: 64, life: 160, alpha: 0.20, second: 0.6 },
      bump:   { reach: 20, life: 120, alpha: 0.16, speed: 1.5 },    // where two words knock together; speed: the slowest knock that makes one (px/frame)
      spread: 'outQuad',   // how the radius grows over the ring's life
      fade:   1.6,         // higher = fades sooner
      width:  1.0,         // line width at birth, px
      strength: 1,         // multiplies every ring's darkness
      size:     1,         // multiplies every ring's reach
    },
    // the ink a dragged word leaves behind. It used to stay for the whole
    // visit; now each print dissolves the way ink does in water — it
    // softens, swells a little, drifts, and fades away.
    ink: {
      // measured: a trail holds for about 2s, melts steadily, is still just
      // visible at 8-9s and gone by 11s
      life:     12,        // seconds for a print to dissolve completely
      strength: 0.07,      // how dark each print is when fresh (0..1)
      soften:   2.5,       // px: how soft it goes as it dissolves. Much past 4 and a
                           // thin pen stroke spreads so wide it vanishes instead
      spread:   0.08,      // how much bigger it grows as it dissolves (share of its size)
      drift:    7,         // px it drifts over its life
      fade:     'inOut',   // how the darkness goes: holds, then melts, then gone
    },
  };
  const VALUES = MOTION;

  // A tuning panel, for the page's owner: open the page with ?tune on the
  // end of the address and /tune.js draws sliders and draggable curves for
  // everything above, changing the page as you move them. "keep on this
  // device" stores the values in localStorage, and they are merged in here
  // on every load; "copy" puts them on the clipboard to send on.
  try {
    const saved = JSON.parse(localStorage.getItem('tune:things-i-like') || 'null');
    const merge = (into, from) => { for (const k in from) { if (from[k] && typeof from[k] === 'object' && !Array.isArray(from[k]) && into[k] && typeof into[k] === 'object') merge(into[k], from[k]); else into[k] = from[k]; } };
    if (saved) merge(VALUES, saved);
  } catch (e) {}
  if (/[?&]tune\b/.test(location.search)) { const sc = document.createElement('script'); sc.src = '/tune.js'; document.body.appendChild(sc); }

  // A CSS cubic-bezier as a function: four numbers, the same ones
  // cubic-bezier.com or the browser's easing editor gives you, and the
  // result maps 0..1 to 0..1 the way the CSS transition would.
  function bezier(x1, y1, x2, y2) {
    const A = (a, b) => 1 - 3 * b + 3 * a, B = (a, b) => 3 * b - 6 * a, C = (a) => 3 * a;
    const at = (t, a, b) => ((A(a, b) * t + B(a, b)) * t + C(a)) * t;
    const slope = (t, a, b) => 3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a);
    return (x) => {
      x = Math.max(0, Math.min(1, x));
      let t = x;
      for (let i = 0; i < 6; i++) { const s = slope(t, x1, x2); if (Math.abs(s) < 1e-6) break; t -= (at(t, x1, x2) - x) / s; }
      return at(Math.max(0, Math.min(1, t)), y1, y2);
    };
  }
  const EASE = {
    linear:     [0, 0, 1, 1],
    ease:       [0.25, 0.1, 0.25, 1],
    inOut:      [0.42, 0, 0.58, 1],
    outQuad:    [0.25, 0.46, 0.45, 0.94],
    outCubic:   [0.33, 1, 0.68, 1],
    outQuint:   [0.22, 1, 0.36, 1],
    outExpo:    [0.16, 1, 0.3, 1],
    inQuad:     [0.55, 0.085, 0.68, 0.53],
  };

  const curve = (e) => { const c = Array.isArray(e) ? e : EASE[e]; return bezier(c[0], c[1], c[2], c[3]); };
  let spreadCurve = curve(MOTION.rings.spread);
  let entranceCurve = curve(MOTION.entrance.ease);
  let inkFadeCurve = curve(MOTION.ink.fade);
  const easeOut = curve('outQuad');
  const between = ([a, b]) => a + Math.random() * (b - a);
  const lerp = ([a, b], u) => a + (b - a) * u;

  // what the tuning panel needs: the values, plain-words controls for
  // them, and what to recompute after a change
  window.TUNE = {
    key: 'things-i-like', values: MOTION, EASE,
    apply() { spreadCurve = curve(MOTION.rings.spread); entranceCurve = curve(MOTION.entrance.ease); inkFadeCurve = curve(MOTION.ink.fade); },
    ringCount: () => rings.length,   // for the tests
    controls: [
      { section: 'floating' },
      { path: 'float.amp',   label: 'how far the words bob', kind: 'pair', min: 0, max: 30, step: 0.5, unit: 'px' },
      { path: 'float.swell', label: 'seconds per bob',       kind: 'pair', min: 2, max: 40, step: 1, unit: 's' },
      { path: 'float.rock',  label: 'rocking',               kind: 'number', min: 0, max: 5, step: 0.1, unit: '°' },
      { section: 'arriving' },
      { path: 'entrance.ease',    label: 'how each word fades in (reload to see)', kind: 'curve' },
      { path: 'entrance.seconds', label: 'seconds to arrive', kind: 'number', min: 0.2, max: 4, step: 0.1, unit: 's' },
      { section: 'dragging' },
      { path: 'drag.follow',  label: 'follows the finger (1 = stuck to it)', kind: 'number', min: 0.05, max: 1, step: 0.01 },
      { path: 'drag.leanDeg', label: 'leans into the move',  kind: 'number', min: 0, max: 15, step: 0.5, unit: '°' },
      { path: 'drag.glide',   label: 'keeps gliding after (higher = further)', kind: 'number', min: 0.5, max: 0.98, step: 0.01 },
      { section: 'bumping' },
      { path: 'bump.bounce', label: 'how bouncy two words are (0 = thud)', kind: 'number', min: 0, max: 1, step: 0.05 },
      { path: 'bump.edge',   label: 'how bouncy the edges are',            kind: 'number', min: 0, max: 1, step: 0.05 },
      { path: 'bump.gap',    label: 'clear water kept between words',      kind: 'number', min: 0, max: 30, step: 1, unit: 'px' },
      { path: 'rings.bump.alpha', label: 'the ring a knock makes',         kind: 'number', min: 0, max: 0.5, step: 0.01 },
      { section: 'tilting the phone' },
      { path: 'tilt.strength', label: 'how fast words slide downhill',     kind: 'number', min: 0, max: 4, step: 0.1 },
      { path: 'tilt.settle',   label: 'seconds until a held tilt is level again', kind: 'number', min: 2, max: 60, step: 1, unit: 's' },
      { path: 'tilt.ignore',   label: 'hand wobble ignored',               kind: 'number', min: 0, max: 10, step: 0.5, unit: '°' },
      { section: 'the water' },
      { path: 'rings.strength', label: 'how dark the rings are', kind: 'number', min: 0, max: 3, step: 0.05, unit: '×' },
      { path: 'rings.size',     label: 'how far they spread',   kind: 'number', min: 0.2, max: 3, step: 0.05, unit: '×' },
      { path: 'rings.wake.alpha',  label: 'the wake behind a dragged word', kind: 'number', min: 0, max: 0.6, step: 0.01 },
      { path: 'rings.wake.every',  label: 'px between its rings', kind: 'number', min: 10, max: 120, step: 2, unit: 'px' },
      { path: 'rings.trail.alpha', label: 'the trail behind the mouse', kind: 'number', min: 0, max: 0.4, step: 0.01 },
      { path: 'rings.trail.every', label: 'px between its rings', kind: 'number', min: 20, max: 200, step: 2, unit: 'px' },
      { path: 'rings.spread',   label: 'how a ring grows over its life', kind: 'curve' },
      { path: 'rings.fade',     label: 'how soon it fades',     kind: 'number', min: 0.5, max: 4, step: 0.1 },
      { path: 'bob.hoverDip',   label: 'the dip when touched',  kind: 'number', min: 0, max: 4, step: 0.1 },
      { path: 'bob.lifted',     label: 'the lift a passing ring gives', kind: 'number', min: 0, max: 8, step: 0.1 },
      { section: 'the letters' },
      { path: 'letters.lift',   label: 'how much the letters ripple', kind: 'number', min: 0, max: 24, step: 0.5, unit: 'px' },
      { path: 'letters.width',  label: 'how wide the wave is',        kind: 'number', min: 6, max: 60, step: 1, unit: 'px' },
      { section: 'the ink a moved word leaves' },
      { path: 'ink.life',     label: 'seconds for a mark to dissolve', kind: 'number', min: 1, max: 40, step: 0.5, unit: 's' },
      { path: 'ink.strength', label: 'how dark a fresh mark is',       kind: 'number', min: 0, max: 0.3, step: 0.005 },
      { path: 'ink.soften',   label: 'how soft it goes as it dissolves (next drag)', kind: 'number', min: 0, max: 8, step: 0.25, unit: 'px' },
      { path: 'ink.spread',   label: 'how much it swells as it dissolves', kind: 'number', min: 0, max: 0.5, step: 0.01, unit: '×' },
      { path: 'ink.drift',    label: 'how far it drifts',              kind: 'number', min: 0, max: 40, step: 1, unit: 'px' },
      { path: 'ink.fade',     label: 'how it fades',                   kind: 'curve' },
    ],
  };

  const styles = {
    serif: (el) => {
      el.style.fontFamily = "'Cormorant Garamond', Georgia, serif";
      el.style.fontWeight = "300";
      el.style.fontStyle = "italic";
      el.style.fontSize = ((2.2 + Math.random() * 1.2) * s) + "rem";
      el.style.color = "#c47a7a";
      el.style.letterSpacing = "0.06em";
    },
    book: (el) => {
      el.style.fontFamily = "'Fraunces', Georgia, serif";
      const w = [200, 300, 400][Math.floor(Math.random() * 3)];
      el.style.fontWeight = w;
      el.style.fontStyle = Math.random() > 0.5 ? "italic" : "normal";
      el.style.fontSize = ((1.1 + Math.random() * 0.8) * s) + "rem";
      el.style.color = "#5a4a40";
    },
    film: (el) => {
      el.style.fontFamily = "'Cormorant Garamond', Georgia, serif";
      el.style.fontWeight = "400";
      el.style.fontSize = ((1.15 + Math.random() * 0.7) * s) + "rem";
      el.style.color = "#7a6a5f";
      el.style.letterSpacing = "0.04em";
    },
    wild: (el) => {
      el.style.fontFamily = "'Fraunces', Georgia, serif";
      el.style.fontWeight = "600";
      el.style.fontSize = ((1.8 + Math.random() * 1) * s) + "rem";
      el.style.color = "#3a2f2f";
      el.style.fontVariationSettings = "'SOFT' 100, 'WONK' 1";
    },
    color: (el) => {
      el.style.fontFamily = "'Fraunces', Georgia, serif";
      el.style.fontWeight = "300";
      el.style.fontSize = ((1.4 + Math.random() * 0.6) * s) + "rem";
      el.style.color = "#5a7a5a";
      el.style.fontStyle = "italic";
      el.style.letterSpacing = "0.1em";
    },
    painting: (el) => {
      el.style.fontFamily = "'Cormorant Garamond', Georgia, serif";
      el.style.fontWeight = "300";
      el.style.fontStyle = "italic";
      el.style.fontSize = ((1.25 + Math.random() * 0.5) * s) + "rem";
      el.style.color = "#5a6a7a";
      el.style.letterSpacing = "0.03em";
    }
  };

  // shuffle
  for (let i = things.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [things[i], things[j]] = [things[j], things[i]];
  }

  /* ================================================================
     MOTION

     Every word is moved by one animation loop rather than its own CSS
     keyframe animation, which is what made the old page feel busy: nine
     words each hitting the corners of a four-stop keyframe on their own
     clock. Here each word has a resting place and floats about it on two
     slow sine waves, like paper on still water. Nothing is ever set
     through left/top after layout: position is a translate, so a move is
     a compositor job, not a re-layout.

     A dragged word follows the finger through a spring, so it trails a
     little and catches up; it leans into the direction it is moving and
     rights itself when it stops. Let go and it keeps its speed and glides
     to rest. Every word knocks into every other and off the edges of the
     screen, so one pushed or thrown into the rest sends them on in turn
     (see BUMPING). Tilting a phone tips the water (see TILT). The ink
     under a dragged word is stamped along the eased path, so the trail
     is a curve rather than a stutter.

     The words sit on water. Under them is a second canvas where rings
     spread and fade, drawn with a hand's wobble like the pool on the home
     page: one when the pointer arrives on a word, a wake behind a word
     being dragged, a splash where it is let go, and a small one under a
     finger. A ring passing under another word bobs it, so a drag sends a
     shiver through the neighbours.
  ================================================================ */
  const field = document.getElementById('field');
  const words = [];        // { el, x, y, vx, vy, w, h, rot, lean, lift, hot, born, p1, p2, p3, fx, fy, ang, sc }
  const placed = [];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // The words are made once the handwriting has arrived. Made straight
  // away, they were measured in the stand-in font the browser holds while
  // it waits (display=block), about 10px narrower per word: on a small
  // phone the spacing was worked out for words smaller than the ones
  // drawn, two could land on top of each other, and a finger on one picked
  // up the other.
  function buildWords() {
  things.forEach((item, idx) => {
    const el = document.createElement(item.url ? 'a' : 'span');
    el.className = 'thing';
    for (const ch of item.text) {
      if (ch === ' ') { el.appendChild(document.createTextNode(' ')); continue; }
      const sp = document.createElement('span'); sp.className = 'ch'; sp.textContent = ch;
      el.appendChild(sp);
    }
    el.dataset.idx = idx;
    if (item.url) {
      el.href = item.url;
      el.target = '_blank';
      el.rel = 'noopener';
    }
    // a link is natively draggable (it drags its address out of the page),
    // which would fight our own drag on a desktop
    el.draggable = false;
    el.addEventListener('dragstart', (e) => e.preventDefault());
    styles[item.style](el);
    { const c = Array.isArray(MOTION.entrance.ease) ? MOTION.entrance.ease : EASE[MOTION.entrance.ease];
      el.style.transition = `opacity ${MOTION.entrance.seconds}s cubic-bezier(${c.join(', ')})`; }
    field.appendChild(el);

    // on mobile, constrain width so long titles wrap within screen
    if (isMobile) {
      el.style.maxWidth = (window.innerWidth - 40) + 'px';
      el.style.whiteSpace = 'normal';
      if (item.twoLinesOnPhone) { el.dataset.lines = '2'; fitTwoLines(el); }
    }

    const w = el.offsetWidth, h = el.offsetHeight;
    // each letter's centre, relative to the word's centre, measured before
    // the word is turned
    const wr = el.getBoundingClientRect();
    const letters = Array.from(el.querySelectorAll('.ch')).map((sp) => {
      const r = sp.getBoundingClientRect();
      return { el: sp, dx: r.left + r.width / 2 - (wr.left + wr.width / 2), dy: r.top + r.height / 2 - (wr.top + wr.height / 2), y: 0 };
    });
    const padX = isMobile ? 15 : 60;
    const maxX = Math.max(field.clientWidth - w - padX, padX);
    const topMin = isMobile ? 120 : 110;
    const maxY = Math.max(window.innerHeight - (isMobile ? 120 : 180), 350);

    let x, y, tries = 0, ok = false;
    while (tries < 150) {
      x = padX + Math.random() * Math.max(maxX, 100);
      y = topMin + Math.random() * (maxY - topMin);
      ok = true;
      const gapX = isMobile ? 15 : 30;
      const gapY = isMobile ? 8 : 15;
      for (const p of placed) {
        if (Math.abs(x - p.x) < (Math.max(w, p.w) + gapX) &&
            Math.abs(y - p.y) < (Math.max(h, p.h) + gapY)) {
          ok = false; break;
        }
      }
      if (ok) break;
      tries++;
    }
    placed.push({ x, y, w, h });

    const rot = -3.5 + Math.random() * 7;
    const word = {
      el, x, y, vx: 0, vy: 0, w, h, rot, lean: 0, lift: 0, hot: false, pressed: false, letters, rippling: false,
      born: performance.now() + 250 + idx * MOTION.entrance.stagger * 1000,
      bob: 0, bobV: 0,
      fx: 0, fy: 0, ang: rot * Math.PI / 180, sc: 1,   // as last drawn: float offset, turn, scale
      ua: Math.random(), us: Math.random(), ul: Math.random(),   // where in each range this word sits
      p1: Math.random() * Math.PI * 2, p2: Math.random() * Math.PI * 2,   // running phases
      p3: Math.random() * Math.PI * 2
    };
    el._word = word;
    words.push(word);
    place(word, 0);
    // hover is a mouse's: on a phone a tap would otherwise leave the word
    // "hovered", lifted, until the next tap somewhere else
    el.addEventListener('pointerenter', (e) => {
      if (e.pointerType !== 'mouse') return;
      word.hot = true;
      word.bobV -= MOTION.bob.hoverDip;
      ringFor(word, MOTION.rings.hover);
    });
    el.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') word.hot = false; });
  });
  relax();
  }

  // A long title marked `twoLinesOnPhone` lay right across a phone's screen
  // on one line. It is made two lines, centred: as narrow as the words
  // allow, so the lines come out as even as they can be. The browser still
  // does the wrapping (and the ink stamp copies it); the width only
  // decides where the break falls.
  function fitTwoLines(el) {
    const chs = el.querySelectorAll('.ch');
    if (!chs.length) return;
    el.style.maxWidth = 'none';
    el.style.whiteSpace = 'nowrap';
    const from = chs[0].getBoundingClientRect().left, to = chs[chs.length - 1].getBoundingClientRect().right;
    const r = document.createRange();
    let best = Infinity;   // the longer line of the best break
    for (const n of el.childNodes) {
      if (n.nodeType !== Node.TEXT_NODE) continue;   // the spaces between words
      r.selectNode(n);
      const sp = r.getBoundingClientRect();
      best = Math.min(best, Math.max(sp.left - from, to - sp.right));
    }
    el.style.whiteSpace = 'normal';
    const cs = getComputedStyle(el);
    const most = window.innerWidth - 40;
    el.style.maxWidth = (best === Infinity ? most : Math.min(most, Math.ceil(best + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 2))) + 'px';
    el.style.textAlign = 'center';
  }

  // Random placement gives up after 150 tries and takes the last one, which
  // on a small phone can sit on another word. Afterwards, any two that
  // overlap are pushed apart, half each, along the shorter way out, and
  // kept on the screen, until nothing overlaps.
  function relax() {
    // the same water the words are kept on while they move, with a little
    // more room left at the bottom when they are first laid out
    const B = pond(), extra = isMobile ? 28 : 36, m = isMobile ? 6 : 12;
    for (let it = 0; it < 160; it++) {
      let moved = false;
      for (let i = 0; i < words.length; i++) for (let j = i + 1; j < words.length; j++) {
        const a = words[i], b = words[j];
        const ax = a.x + a.w / 2, ay = a.y + a.h / 2, bx = b.x + b.w / 2, by = b.y + b.h / 2;
        const ox = (a.w + b.w) / 2 + m - Math.abs(ax - bx), oy = (a.h + b.h) / 2 + m - Math.abs(ay - by);
        if (ox <= 0 || oy <= 0) continue;
        moved = true;
        // the shorter way out, except for a spell in the middle when only
        // sideways is tried: on a short screen (a phone on its side) the
        // way up or down is often a wall, and they would push forever
        if (ox < oy || (it >= 40 && it < 80)) { const k = Math.sign(bx - ax) || 1; a.x -= k * ox / 2; b.x += k * ox / 2; }
        else         { const k = Math.sign(by - ay) || 1; a.y -= k * oy / 2; b.y += k * oy / 2; }
      }
      for (const q of words) {
        q.x = clamp(q.x, B.l, Math.max(B.l, B.r - q.w));
        q.y = clamp(q.y, B.t, Math.max(B.t, B.b - q.h - extra));
      }
      if (!moved) break;
    }
  }

  // The water the words may float on: below the title, inside the sides of
  // the screen, and above the bottom of what is actually on screen. On a
  // phone a full-height page runs on under the browser's bottom bar, so the
  // bottom is the visible height, not the page's.
  function pond() {
    return { l: 8, r: field.clientWidth - 8, t: isMobile ? 110 : 100, b: window.innerHeight - (isMobile ? 12 : 24) };
  }

  // Turning a phone on its side kept every word where it was, so they sat
  // piled in the left third of the wider screen, some over the title. On a
  // real change of shape the words are spread out to the new one, keeping
  // their places relative to each other, and pushed apart again. A change in
  // height alone (a phone's address bar sliding away) doesn't count.
  let fieldW = 0, fieldH = 0;
  function fieldSize() { return [field.clientWidth, Math.max(field.clientHeight, window.innerHeight)]; }
  window.addEventListener('resize', () => {
    const [w, h] = fieldSize();
    if (!words.length || !fieldW) return;
    if (w === fieldW && Math.abs(h - fieldH) < 120) return;
    levelX = null;   // the tilt's sense of level turned with the phone: start it afresh
    for (const q of words) {
      q.x = (q.x + q.w / 2) * w / fieldW - q.w / 2;
      q.y = (q.y + q.h / 2) * h / fieldH - q.h / 2;
      q.vx = 0; q.vy = 0;
    }
    fieldW = w; fieldH = h;
    relax();
  });

  // If the font is slower than the wait below, the words are made in the
  // stand-in and measured, and spaced, again when it lands.
  function remeasure() {
    for (const q of words) {
      const tf = q.el.style.transform;
      q.el.style.transform = 'none';
      if (q.el.dataset.lines === '2') fitTwoLines(q.el);   // the break may fall elsewhere in the real font
      q.w = q.el.offsetWidth; q.h = q.el.offsetHeight;
      const wr = q.el.getBoundingClientRect();
      for (const l of q.letters) {
        const r = l.el.getBoundingClientRect();
        l.dx = r.left + r.width / 2 - (wr.left + wr.width / 2);
        l.dy = r.top + r.height / 2 - (wr.top + wr.height / 2) - l.y;
      }
      q.el.style.transform = tf;
    }
    relax();   // grown words may now touch; the letters only just became visible, so a nudge goes unseen
  }
  {
    let built = false;
    const build = () => {
      if (built) return;
      built = true;
      buildWords();
      [fieldW, fieldH] = fieldSize();
      if (document.fonts) document.fonts.addEventListener('loadingdone', remeasure);
    };
    const fontsIn = document.fonts
      ? Promise.all(['400 1em Unkempt', '700 1em Unkempt'].map((f) => document.fonts.load(f)))
      : Promise.resolve();
    Promise.race([fontsIn, new Promise((r) => setTimeout(r, 2500))]).then(build, build);
  }

  function place(q, dt) {
    const age = clamp((performance.now() - q.born) / (MOTION.entrance.seconds * 1000), 0, 1);
    if (age > 0 && !q.el.classList.contains('in')) q.el.classList.add('in');
    const rise = (1 - entranceCurve(age)) * MOTION.entrance.rise;
    // the swells advance by their own phase each frame, so a change to
    // the speed (from the tuning panel) bends the motion instead of
    // jumping it
    const amp = lerp(MOTION.float.amp, q.ua);
    const f1 = Math.PI * 2 / lerp(MOTION.float.swell, q.us), f2 = Math.PI * 2 / lerp(MOTION.float.slow, q.ul);
    q.p1 += f1 * dt; q.p2 += f2 * dt; q.p3 += f1 * 0.8 * dt;
    const fx = Math.sin(q.p1) * amp + Math.sin(q.p2) * amp * 0.5;
    const fy = Math.cos(q.p3) * amp * 0.7 + Math.sin(q.p2 * 1.3) * amp * 0.3 + q.bob;
    const wob = (Math.sin(q.p3) + Math.sin(q.p2) * 0.5) * MOTION.float.rock;
    const sc = 1 + q.lift * MOTION.drag.lift;
    // kept for the bumping, which goes by where the bubble is drawn
    q.fx = fx; q.fy = fy; q.ang = (q.rot + wob + q.lean) * Math.PI / 180; q.sc = sc;
    q.el.style.transform = `translate3d(${(q.x + fx).toFixed(2)}px, ${(q.y + fy + rise).toFixed(2)}px, 0) rotate(${(q.rot + wob + q.lean).toFixed(2)}deg) scale(${sc.toFixed(3)})`;
  }

  /* ---------------- BUMPING ----------------
     It used to be only the dragged word that pushed, and only straight
     sideways or straight up or down, by a box drawn round each word. A
     word it pushed, or one that was thrown, then slid with nothing in its
     way: it glided on into the next word and stopped on top of it, and one
     plough through the middle left three or four words piled up at an
     edge. Now every word knocks into every other, all the time.

     Each bubble is a pill: a line through the middle of the word, turned
     with it, thickened by half its height, where it is drawn (float and
     all). Two touch when their lines come closer than their two radii
     plus MOTION.bump.gap, and are pushed apart along the line between the
     nearest points: straight apart side by side, glancing off each
     other's round ends at a corner.

     A push is shared by size, so the bigger word gives way less. A word
     under a finger doesn't give way at all, unless the one it presses on
     has its back to an edge (or to a word that does): then the held word
     is stopped instead of squeezing the other through the wall. A few
     passes over every pair each frame let a push travel down a line of
     words. Closing speed is turned back by MOTION.bump.bounce; a very slow
     one just stops, so words resting against each other or an edge (on a
     tilted phone) sit still instead of buzzing.
  ------------------------------------------------ */
  const PASSES = 6;
  const SLOW = 0.4;              // px/frame: closing slower than this is resting, not a knock
  const knockedAt = new Map();   // pair -> when it last made a ring
  const held = (q) => dragEl !== null && dragEl._word === q;
  const heft = (q) => 1 / (q.w * q.h);   // how easily a word is pushed: bigger is heavier

  function pillOf(q) {
    const cx = q.x + q.fx + q.w / 2, cy = q.y + q.fy + q.h / 2;
    const flat = q.w >= q.h;
    const r = Math.min(q.w, q.h) / 2 * q.sc, half = Math.abs(q.w - q.h) / 2 * q.sc;
    const c = Math.cos(q.ang), s = Math.sin(q.ang);
    const ux = flat ? c : -s, uy = flat ? s : c;
    // ex, ey: how far it reaches from its centre, sideways and up/down
    return { cx, cy, ux, uy, half, r, ex: Math.abs(ux) * half + r, ey: Math.abs(uy) * half + r };
  }
  // a word moved during bumping carries its pill with it
  function shift(q, dx, dy) { q.x += dx; q.y += dy; q.P.cx += dx; q.P.cy += dy; }

  // how far a pill is past the edges of the water, as the move back in
  const out = { x: 0, y: 0 };
  function past(P, B) {
    out.x = P.cx - P.ex < B.l ? B.l - (P.cx - P.ex) : P.cx + P.ex > B.r ? B.r - (P.cx + P.ex) : 0;
    out.y = P.cy - P.ey < B.t ? B.t - (P.cy - P.ey) : P.cy + P.ey > B.b ? B.b - (P.cy + P.ey) : 0;
    return out;
  }

  // The nearest points of two pills' middle lines, into `near` (closest
  // points of two segments, as in Ericson's Real-Time Collision Detection).
  const near = { x1: 0, y1: 0, x2: 0, y2: 0 };
  function nearest(A, B) {
    const p1x = A.cx - A.ux * A.half, p1y = A.cy - A.uy * A.half, d1x = A.ux * 2 * A.half, d1y = A.uy * 2 * A.half;
    const p2x = B.cx - B.ux * B.half, p2y = B.cy - B.uy * B.half, d2x = B.ux * 2 * B.half, d2y = B.uy * 2 * B.half;
    const rx = p1x - p2x, ry = p1y - p2y;
    const a = d1x * d1x + d1y * d1y, e = d2x * d2x + d2y * d2y, f = d2x * rx + d2y * ry;
    let s = 0, t = 0;
    if (a <= 1e-9 && e > 1e-9) t = clamp(f / e, 0, 1);
    else if (a > 1e-9) {
      const c = d1x * rx + d1y * ry;
      if (e <= 1e-9) s = clamp(-c / a, 0, 1);
      else {
        const b = d1x * d2x + d1y * d2y, den = a * e - b * b;
        s = den > a * e * 1e-9 ? clamp((b * f - c * e) / den, 0, 1) : 0;   // parallel: any point will do
        t = (b * s + f) / e;
        if (t < 0) { t = 0; s = clamp(-c / a, 0, 1); }
        else if (t > 1) { t = 1; s = clamp((b - c) / a, 0, 1); }
      }
    }
    near.x1 = p1x + d1x * s; near.y1 = p1y + d1y * s;
    near.x2 = p2x + d2x * t; near.y2 = p2y + d2y * t;
  }

  // Two words that touch are pushed apart; on the first pass of a frame
  // their speeds along the push are exchanged too. Returns whether they
  // touched.
  function knock(a, b, first, pair, now) {
    const A = a.P, Bp = b.P, G = MOTION.bump;
    if (Math.abs(A.cx - Bp.cx) > A.ex + Bp.ex + G.gap || Math.abs(A.cy - Bp.cy) > A.ey + Bp.ey + G.gap) return false;
    nearest(A, Bp);
    let nx = near.x2 - near.x1, ny = near.y2 - near.y1, d = Math.hypot(nx, ny);
    if (d > 1e-6) { nx /= d; ny /= d; }
    else {
      // their middle lines cross (one dropped straight across the other):
      // out the way their centres already lie
      nx = Bp.cx - A.cx; ny = Bp.cy - A.cy;
      const c = Math.hypot(nx, ny);
      if (c > 1e-6) { nx /= c; ny /= c; } else { nx = 0; ny = 1; }
      d = 0;
    }
    const pen = A.r + Bp.r + G.gap - d;
    if (pen <= 0) return false;

    let wa = held(a) || a.pin ? 0 : heft(a), wb = held(b) || b.pin ? 0 : heft(b);
    // neither will move: a held word gives way to one backed against an
    // edge, and two backed against edges share it
    if (!wa && !wb) { wa = held(b) ? 0 : heft(a); wb = held(a) ? 0 : heft(b); }
    const k = pen / (wa + wb);
    shift(a, -nx * k * wa, -ny * k * wa);
    shift(b, nx * k * wb, ny * k * wb);
    // pressed against one that can't move, it can't move that way either
    if (a.pin && !held(b)) b.pin = true;
    else if (b.pin && !held(a)) a.pin = true;

    if (first) {
      const closing = -((b.vx - a.vx) * nx + (b.vy - a.vy) * ny);
      if (closing > 0) {
        const ia = held(a) ? 0 : heft(a), ib = held(b) ? 0 : heft(b);
        if (ia + ib > 0) {
          const J = (1 + (closing > SLOW ? G.bounce : 0)) * closing / (ia + ib);
          a.vx -= J * ia * nx; a.vy -= J * ia * ny;
          b.vx += J * ib * nx; b.vy += J * ib * ny;
        }
        // a knock you could hear: a ring where they met, which rocks them
        // both as it passes under them
        const R = MOTION.rings.bump;
        if (closing > R.speed && now - (knockedAt.get(pair) || -1e9) > 250) {
          knockedAt.set(pair, now);
          const sp = Math.min(closing, 12);
          ripple(near.x1 + nx * A.r, near.y1 + ny * A.r, R.reach + sp * 3, R.life, R.alpha * Math.min(1, sp / 5));
        }
      }
    }
    return true;
  }

  // The edges of the water: a word that reaches one stops against it and
  // comes back off it a little.
  function edges(q, B) {
    const o = past(q.P, B);
    if (!o.x && !o.y) return;
    shift(q, o.x, o.y);
    q.pin = true;
    const E = MOTION.bump.edge;
    if (o.x && q.vx * o.x < 0) q.vx = Math.abs(q.vx) > SLOW ? -q.vx * E : 0;
    if (o.y && q.vy * o.y < 0) q.vy = Math.abs(q.vy) > SLOW ? -q.vy * E : 0;
  }

  function bumpAll(B, now) {
    for (const q of words) { q.P = pillOf(q); q.pin = false; }
    for (let pass = 0; pass < PASSES; pass++) {
      let touching = false;
      for (let i = 0; i < words.length; i++) for (let j = i + 1; j < words.length; j++) {
        if (knock(words[i], words[j], pass === 0, i * 64 + j, now)) touching = true;
      }
      // one already well past an edge is being eased back in (see step)
      for (const q of words) if (!q.stray) edges(q, B);
      if (!touching) break;
    }
  }

  // --- WATER ---
  const waterEl = document.getElementById('water');
  const waterC = waterEl.getContext('2d');
  let rings = [];          // { x, y, r, maxR, age, life, a, ph, hit:Set }
  let wakeDist = 0, wakeX = 0, wakeY = 0;

  function ripple(x, y, maxR, life, a) {
    if (rings.length > 80) rings.shift();
    rings.push({ x, y, maxR: maxR * MOTION.rings.size, age: 0, life, a: a * MOTION.rings.strength, ph: Math.random() * Math.PI * 2, hit: new Set() });
  }
  // a ring (and, if the setting has `second`, a smaller one a beat later)
  // centred on a word, sized from MOTION.rings
  function ringFor(q, R, extra = 0) {
    const cx = q.x + q.w / 2, cy = q.y + q.h / 2;
    ripple(cx, cy, q.w * (R.share || 0) + R.reach + extra, R.life, R.alpha);
    if (R.second) setTimeout(() => ripple(cx, cy, (q.w * (R.share || 0) + R.reach + extra) * R.second, R.life * 0.85, R.alpha * 0.6), 220);
  }

  function wobblyRing(c, x, y, r, ph, color) {
    c.strokeStyle = color;
    c.beginPath();
    for (let i = 0; i <= 44; i++) {
      const a = i / 44 * Math.PI * 2;
      const rr = r * (1 + 0.05 * Math.sin(3 * a + ph) + 0.035 * Math.sin(5 * a - ph * 1.3));
      const X = x + Math.cos(a) * rr, Y = y + Math.sin(a) * rr * 0.55;
      i ? c.lineTo(X, Y) : c.moveTo(X, Y);
    }
    c.closePath();
    c.stroke();
  }

  // Each ring lifts the letters its front is passing under: a bump the
  // width of the front, fading with the ring. Summed over all rings, so
  // two rings crossing add up, and left alone (no style writes) once no
  // ring is near.
  function rippleLetters() {
    const L = MOTION.letters;
    for (const q of words) {
      const cx = q.x + q.w / 2, cy = q.y + q.h / 2;
      let any = false;
      for (const l of q.letters) l.y = 0;
      for (const g of rings) {
        const k = g.age / g.life;
        // the lift follows the ring's life, not its darkness: a faint ring
        // still moves the letters; only very small ones (a wake) do less
        const a = Math.min(1, g.a / 0.2) * Math.pow(1 - k, MOTION.rings.fade);
        if (a < 0.02) continue;
        // skip rings nowhere near this word
        const dc = Math.hypot(cx - g.x, (cy - g.y) / 0.55);
        if (Math.abs(dc - g.r) > q.w / 2 + L.width * 2) continue;
        for (const l of q.letters) {
          const d = Math.hypot(cx + l.dx - g.x, (cy + l.dy - g.y) / 0.55) - g.r;
          const bump = Math.exp(-(d * d) / (2 * L.width * L.width));
          if (bump > 0.01) { l.y -= L.lift * a * bump; any = true; }
        }
      }
      if (any) {
        q.rippling = true;
        for (const l of q.letters) l.el.style.transform = l.y ? `translateY(${l.y.toFixed(2)}px)` : '';
      } else if (q.rippling) {
        q.rippling = false;
        for (const l of q.letters) l.el.style.transform = '';
      }
    }
  }

  // frames: how long this frame was, in frames of a 60Hz screen (see tick)
  function ageRings(frames) {
    for (let i = rings.length - 1; i >= 0; i--) {
      const g = rings[i];
      g.age += frames;
      if (g.age > g.life) { rings.splice(i, 1); continue; }
      const k = g.age / g.life;
      g.r = 2 + (g.maxR - 2) * spreadCurve(k);
      // a ring reaching a word lifts it a little, once
      for (const q of words) {
        if (g.hit.has(q) || (dragEl && dragEl._word === q)) continue;
        const d = Math.hypot(q.x + q.w / 2 - g.x, (q.y + q.h / 2 - g.y) / 0.55);
        if (Math.abs(d - g.r) < 14) { g.hit.add(q); q.bobV -= MOTION.bob.lifted * g.a * (1 - k * 0.6); }
      }
    }
  }

  function drawWater() {
    const c = waterC;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, inkW, inkH);
    c.lineCap = 'round';
    for (const g of rings) {
      const k = g.age / g.life;
      const a = g.a * Math.pow(1 - k, MOTION.rings.fade);
      if (a < 0.01) continue;
      c.lineWidth = MOTION.rings.width * (1 - k * 0.5);
      wobblyRing(c, g.x, g.y, g.r, g.ph, `rgba(96, 112, 148, ${a})`);
      if (g.r > 10) { c.lineWidth = 0.7; wobblyRing(c, g.x, g.y, g.r * 0.6, g.ph + 1.7, `rgba(96, 112, 148, ${a * 0.45})`); }
    }
  }

  let dragEl = null, dragOffX = 0, dragOffY = 0, hasDragged = false;
  let startX = 0, startY = 0, tgtX = 0, tgtY = 0;
  let dragThreshold = 5;   // px before a press becomes a carry: set per pointer in startDrag

  // Every speed, pull and fade here is counted per frame of a 60Hz screen,
  // the one it was tuned on. A phone that draws at 90 or 120Hz used to run
  // them all that much more often: the finger pulled harder, a push faded
  // sooner, rings came and went faster. Now each frame counts as the
  // share `k` of a 60Hz frame it lasted, and everything is scaled by it,
  // so it moves the same on every screen and still redraws on every frame
  // the screen shows. A slow frame is stepped in pieces, so a thrown word
  // can't jump through another in one go.
  let lastNow = 0;
  function tick(now) {
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0.016;
    lastNow = now;
    const k = dt * 60, n = Math.max(1, Math.ceil(k - 0.01));
    for (let i = 0; i < n; i++) step(k / n, now);
    for (const q of words) place(q, dt);
    ageRings(k);
    drawWater();
    drawInk(now);
    rippleLetters();
    requestAnimationFrame(tick);
  }

  function step(k, now) {
    const B = pond();
    const glide = Math.pow(MOTION.drag.glide, k);
    const downhill = MOTION.tilt.strength * k;
    const ease = (rate) => 1 - Math.pow(1 - rate, k);
    for (const q of words) {
      // well past an edge before it has even moved: the water got smaller
      // under it (a phone's bar sliding in, the phone turning), so it is
      // eased back in, as it always used to be, rather than jumping
      const o = past(pillOf(q), B);
      q.stray = Math.abs(o.x) > 2 || Math.abs(o.y) > 2;
      const dragging = held(q) && hasDragged;
      if (dragging) {
        const f = ease(MOTION.drag.follow);
        const nx = q.x + (tgtX - q.x) * f, ny = q.y + (tgtY - q.y) * f;
        q.vx = (nx - q.x) / k; q.vy = (ny - q.y) / k;
        q.x = nx; q.y = ny;
        inkAlong(q.x, q.y);
        // a wake: small rings every so often along the way
        const sp = Math.hypot(q.vx, q.vy);
        wakeDist += sp * k;
        if (sp > 0.8 && wakeDist > MOTION.rings.wake.every) {
          wakeDist = 0;
          const R = MOTION.rings.wake;
          ripple(q.x + q.w / 2 + (Math.random() - 0.5) * q.w * 0.5, q.y + q.h / 2, R.reach + Math.min(sp, 14) * 2, R.life, R.alpha);
        }
      } else if (held(q)) {
        // pressed and not yet moved: the finger holds it where it is
        q.vx = 0; q.vy = 0;
      } else {
        q.vx += slopeX * downhill; q.vy += slopeY * downhill;
        if (q.stray) { q.vx += o.x * 0.08 * k; q.vy += o.y * 0.08 * k; }
        q.x += q.vx * k; q.y += q.vy * k;
        q.vx *= glide; q.vy *= glide;
        if (Math.abs(q.vx) < 0.01) q.vx = 0;
        if (Math.abs(q.vy) < 0.01) q.vy = 0;
        if (glideInk === q) {
          if (Math.hypot(q.vx, q.vy) > 0.4) inkAlong(q.x, q.y); else { glideInk = null; stamp = null; }
        }
      }
      const leanTo = clamp(q.vx * 1.0, -MOTION.drag.leanDeg, MOTION.drag.leanDeg);
      q.lean += (leanTo - q.lean) * ease(dragging ? MOTION.drag.leanRate * 1.8 : MOTION.drag.leanRate);
      // held: lifted; pressed and not yet moved: pushed down into the water,
      // the way a button goes in; touched: lifted a little
      const liftTo = dragging ? 1 : q.pressed ? -0.9 : q.hot ? 1 : 0;
      q.lift += (liftTo - q.lift) * ease(q.pressed ? 0.3 : 0.12);
      // the bob: a spring back to level, so a ring or a hover rocks the word
      q.bobV += -q.bob * MOTION.bob.spring * k; q.bobV *= Math.pow(MOTION.bob.damping, k); q.bob += q.bobV * k;
    }
    bumpAll(B, now);
  }

  /* ---------------- TILT ----------------
     A phone's tilt tips the water. The pull of gravity along the screen
     comes from the phone's front-back (beta) and side-to-side (gamma)
     angles, turned to match the screen if the phone is on its side. How
     the phone is being held is taken as level, and that follows the phone
     over MOTION.tilt.settle seconds: a quick tilt sends the words sliding,
     a phone held at a new angle stops tipping them after a while. Other
     phones report tilt without asking; iPhones need askTilt below.
  ------------------------------------------------ */
  let slopeX = 0, slopeY = 0;            // downhill on the screen: direction, and steepness (0..1)
  let levelX = null, levelY = null, tiltAt = 0;
  function onTilt(e) {
    if (e.beta == null || e.gamma == null) return;   // a computer without the sensor reports one empty reading
    if (!tiltFelt) { tiltFelt = true; showAsk(false); }
    const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    const ux = Math.sin(g) * Math.cos(b), uy = Math.sin(b);   // along the screen held upright
    const so = window.screen && screen.orientation;
    const turn = (so && typeof so.angle === 'number' ? so.angle : (window.orientation || 0)) * Math.PI / 180;
    const gx = ux * Math.cos(turn) + uy * Math.sin(turn), gy = uy * Math.cos(turn) - ux * Math.sin(turn);
    const now = performance.now();
    if (levelX === null) { levelX = gx; levelY = gy; }
    else {
      const u = 1 - Math.exp(-Math.min(0.5, (now - tiltAt) / 1000) / Math.max(0.1, MOTION.tilt.settle));
      levelX += (gx - levelX) * u; levelY += (gy - levelY) * u;
    }
    tiltAt = now;
    const sx = gx - levelX, sy = gy - levelY, m = Math.hypot(sx, sy);
    const still = Math.sin(MOTION.tilt.ignore * Math.PI / 180);
    const f = m > still ? (m - still) / m : 0;
    slopeX = sx * f; slopeY = sy * f;
  }
  // iPhones only report tilt once the visitor allows it, and Safari only
  // shows its "allow motion" question in answer to a tap. It is asked when
  // someone first plays with the water (the end of a carry, or a touch on
  // the water), never on a tap that opens a link. The first version asked
  // once, at the end of a carry, and gave up when Safari refused, which it
  // does when a drag isn't a tap: nobody was ever asked. Now a refusal
  // brings up a small "tap here, then tilt your phone" at the bottom, and a
  // tap on that is the tap Safari wants. It keeps trying until Safari gives
  // an answer, and a phone already allowed on this visit (tilt readings are
  // arriving) is never asked at all.
  let tiltFelt = false, tiltAnswered = false, asking = false, playing = false, askTimer = 0;
  const askEl = document.getElementById('tiltAsk');
  const Orient = window.DeviceOrientationEvent;
  const tiltNeedsAsking = !!(Orient && typeof Orient.requestPermission === 'function');
  if (Orient) window.addEventListener('deviceorientation', onTilt);
  function showAsk(on) {
    clearTimeout(askTimer);
    askEl.classList.toggle('show', on);
    if (on) askTimer = setTimeout(() => askEl.classList.remove('show'), 12000);   // offered, not insisted on
  }
  function askTilt() {
    if (!tiltNeedsAsking || tiltFelt || tiltAnswered || asking) return;
    asking = true;
    let answer;
    try { answer = Orient.requestPermission(); } catch (err) { answer = Promise.reject(err); }
    Promise.resolve(answer).then((state) => {
      tiltAnswered = true;
      showAsk(false);
      // listened for from the start; listening afresh makes sure Safari
      // starts sending now that it's allowed
      if (state === 'granted') { window.removeEventListener('deviceorientation', onTilt); window.addEventListener('deviceorientation', onTilt); }
    }, () => showAsk(true)).finally(() => { asking = false; });
  }
  field.addEventListener('touchend', () => { if (playing) askTilt(); }, { passive: true });
  askEl.addEventListener('click', askTilt);
  window.TUNE.slope = () => [slopeX, slopeY];   // for the tests

  // --- INK ---
  // The words are HTML and the browser paints them; we can't smudge them
  // directly. Instead, when a drag starts, the word is painted once more —
  // same text, same font, same colour, wrapped the way the browser wrapped
  // it — into a small scratch canvas: a rubber stamp of the word. While it
  // moves, that stamp is pressed every few pixels along the path.
  //
  // The prints used to be burned into the canvas and stay for the whole
  // visit. Now each one is kept in a list and dissolves the way ink does in
  // water: it softens, swells a little, drifts, and fades, over
  // MOTION.ink.life seconds. The canvas is redrawn from the list each frame,
  // and left alone once the last print has gone.
  const inkEl = document.getElementById('ink');
  const inkC = inkEl.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let inkW = 0, inkH = 0;
  const STAMP_EVERY = 22;   // px of travel between prints: far enough apart that each echo of the word stays readable
  const INK_MAX = 320;      // prints alive at once; the oldest go first
  // Redrawing every print every frame made the page three times slower
  // (measured: 60fps -> 20fps on a phone profile). Two things make it cheap
  // without changing how it looks. The ink is drawn at one canvas pixel per
  // css pixel, not the screen's full sharpness: it is faint and soft by
  // design, and that is a quarter of the pixels on a 2x screen. And it is
  // redrawn a few times a second rather than every frame: a print takes
  // twelve seconds to dissolve, so no eye can tell 60 redraws a second from
  // 15. It redraws faster while a word is being carried, so new prints
  // appear right behind it.
  const INK_SCALE = 1;
  const INK_EVERY_MS = 100, INK_EVERY_MS_CARRYING = 50;
  let inkDrawnAt = 0;
  const inks = [];          // { s: stamp, x, y, born, dx, dy }
  let inkDirty = false;     // the canvas holds something that needs clearing

  function sizeInk() {
    const w = field.clientWidth, h = field.clientHeight;
    if (w === inkW && h === inkH) return;
    inkW = w; inkH = h;
    // only the pixels behind them: their size on the page is the CSS 100%,
    // so they can never be left bigger than the field after it shrinks
    inkEl.width = Math.ceil(w * INK_SCALE); inkEl.height = Math.ceil(h * INK_SCALE);
    waterEl.width = Math.ceil(w * dpr); waterEl.height = Math.ceil(h * dpr);
    inkDirty = true;   // resizing wiped it; the next frame redraws the prints from the list
  }
  sizeInk();
  window.addEventListener('resize', sizeInk);

  let stamp = null, lastStampX = 0, lastStampY = 0, glideInk = null;

  // A soft copy of a print, the way it looks once the water has had it a
  // while. Made by laying the print down many times around a small circle
  // rather than with a canvas blur filter, which older Safari doesn't have
  // — and done once when a drag starts, never per frame.
  function softened(src, w, h, r) {
    const pad = Math.ceil(r) + 1;
    const c = document.createElement('canvas');
    c.width = Math.ceil((w + 2 * pad) * INK_SCALE); c.height = Math.ceil((h + 2 * pad) * INK_SCALE);
    const x = c.getContext('2d');
    const lay = (ox, oy, a) => { x.globalAlpha = a; x.drawImage(src, (pad + ox) * INK_SCALE, (pad + oy) * INK_SCALE, w * INK_SCALE, h * INK_SCALE); };
    if (r < 0.5) { lay(0, 0, 1); return { c, pad }; }
    const taps = [[0, 0]];
    for (const [rad, n] of [[r * 0.45, 8], [r, 14]]) {
      for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2 + rad; taps.push([Math.cos(t) * rad, Math.sin(t) * rad]); }
    }
    // each copy is faint, so together they come to a print that has spread
    // out and gone a little lighter, as ink does, rather than a darker one
    const a = Math.min(1, 1.9 / taps.length);
    for (const [ox, oy] of taps) lay(ox, oy, a);
    x.globalAlpha = 1;
    return { c, pad };
  }

  // One state of a print, finished: softened, turned to the word's tilt and
  // swollen, on a canvas just big enough for the result. Doing the turning
  // and swelling here, once per drag, means drawing a print every frame is
  // a plain copy at a whole-pixel position — no rotation or scaling to
  // resample, which is what made redrawing the prints expensive.
  function bake(src, w, h, rot, soft, grow) {
    const sd = softened(src, w, h, soft);
    const bw = (w + 2 * sd.pad) * grow, bh = (h + 2 * sd.pad) * grow;
    const cos = Math.abs(Math.cos(rot)), sin = Math.abs(Math.sin(rot));
    const W = Math.ceil((bw * cos + bh * sin) * INK_SCALE) + 2, H = Math.ceil((bw * sin + bh * cos) * INK_SCALE) + 2;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.translate(W / 2, H / 2); x.rotate(rot); x.scale(grow, grow);
    x.drawImage(sd.c, -sd.c.width / 2, -sd.c.height / 2);
    return { c, hw: W / 2 / INK_SCALE, hh: H / 2 / INK_SCALE };   // half size, in css px
  }

  function buildStamp(el) {
    const cs = getComputedStyle(el);
    const w = el.offsetWidth, h = el.offsetHeight;   // the box before its rotation
    if (!w || !h) return null;
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * INK_SCALE); c.height = Math.ceil(h * INK_SCALE);
    const x = c.getContext('2d');
    x.scale(INK_SCALE, INK_SCALE);
    x.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    if ('letterSpacing' in x) x.letterSpacing = cs.letterSpacing;
    x.fillStyle = cs.color;
    x.textBaseline = 'alphabetic';
    // the text sits inside the word's padding, the room kept for its bubble
    const px = (k) => parseFloat(cs[k]) || 0;
    const padL = px('paddingLeft') + px('borderLeftWidth'), padR = px('paddingRight') + px('borderRightWidth');
    const padT = px('paddingTop') + px('borderTopWidth'), padB = px('paddingBottom') + px('borderBottomWidth');
    // wrap the way the browser did: greedily at spaces, against the text's width
    const inner = w - padL - padR;
    const lines = []; let cur = '';
    for (const wd of el.textContent.split(' ')) {
      const t = cur ? cur + ' ' + wd : wd;
      if (cur && x.measureText(t).width > inner + 0.5) { lines.push(cur); cur = wd; } else cur = t;
    }
    if (cur) lines.push(cur);
    const m = x.measureText('Hg');
    const fs = parseFloat(cs.fontSize);
    const asc = m.fontBoundingBoxAscent || fs * 0.8;
    const desc = m.fontBoundingBoxDescent || fs * 0.2;
    const lineH = (h - padT - padB) / lines.length;
    const centred = cs.textAlign === 'center';   // a title made two lines on a phone
    lines.forEach((ln, i) => x.fillText(ln, centred ? padL + (inner - x.measureText(ln).width) / 2 : padL, padT + i * lineH + (lineH - asc - desc) / 2 + asc));
    // three states of the same print: fresh, softening, dissolved — each a
    // little softer and a little bigger than the last
    const r = Math.max(0, MOTION.ink.soften), g = Math.max(0, MOTION.ink.spread);
    const rot = (el._word ? el._word.rot : 0) * Math.PI / 180;
    const levels = [bake(c, w, h, rot, 0, 1), bake(c, w, h, rot, r * 0.45, 1 + g * 0.5), bake(c, w, h, rot, r, 1 + g)];
    return { levels, w, h };
  }

  function pressStamp(x, y) {
    if (!stamp) return;
    if (inks.length >= INK_MAX) inks.shift();
    const t = Math.random() * Math.PI * 2;   // each print drifts its own way
    inks.push({ s: stamp, x, y, born: performance.now(), dx: Math.cos(t), dy: Math.sin(t) });
  }

  // Every frame: each print, as far through dissolving as its age says.
  // Softness walks through the three states, crossfading between the two
  // it is between, so it melts rather than stepping.
  function drawInk(now) {
    if (!inks.length) {
      if (inkDirty) { inkC.setTransform(1, 0, 0, 1, 0, 0); inkC.clearRect(0, 0, inkEl.width, inkEl.height); inkDirty = false; }
      return;
    }
    if (now - inkDrawnAt < (dragEl ? INK_EVERY_MS_CARRYING : INK_EVERY_MS)) return;
    inkDrawnAt = now;
    const I = MOTION.ink, life = Math.max(0.1, I.life) * 1000;
    const c = inkC;
    c.setTransform(1, 0, 0, 1, 0, 0);   // prints are drawn in canvas pixels, untransformed
    c.clearRect(0, 0, inkEl.width, inkEl.height);
    let n = 0;
    for (let i = 0; i < inks.length; i++) {
      const p = inks[i];
      const k = (now - p.born) / life;
      if (k >= 1) continue;          // dissolved: dropped from the list
      inks[n++] = p;
      const a = I.strength * (1 - inkFadeCurve(k));
      if (a < 0.002) continue;
      const e = easeOut(k);          // it drifts early, then settles
      // it softens and swells evenly over its whole life, through its three
      // states: the nearest one is drawn. At this faintness the step from
      // one to the next can't be seen
      const L = p.s.levels[Math.min(2, Math.round(k * 2))];
      const cx = p.x + p.s.w / 2 + p.dx * I.drift * e, cy = p.y + p.s.h / 2 + p.dy * I.drift * e;
      c.globalAlpha = a;
      c.drawImage(L.c, Math.round((cx - L.hw) * INK_SCALE), Math.round((cy - L.hh) * INK_SCALE));
    }
    inks.length = n;
    c.globalAlpha = 1;
    inkDirty = true;
  }
  window.TUNE.inkCount = () => inks.length;   // for the tests

  // Press along the whole segment since the last print, so a fast drag
  // leaves a continuous (if faint) trail rather than dashes.
  function inkAlong(x, y) {
    if (!stamp) return;
    const dx = x - lastStampX, dy = y - lastStampY;
    const dist = Math.hypot(dx, dy);
    if (dist < STAMP_EVERY) return;
    const n = Math.min(60, Math.floor(dist / STAMP_EVERY));
    for (let i = 1; i <= n; i++) pressStamp(lastStampX + dx * i / n, lastStampY + dy * i / n);
    lastStampX = x; lastStampY = y;
  }

  // --- DRAG ---
  function startDrag(el, clientX, clientY, pointerType) {
    const q = el._word;
    dragEl = el;
    hasDragged = false;
    dragThreshold = pointerType === 'mouse' ? 4 : 9;
    // pressed: the bubble gives, like a button, until it moves
    q.pressed = true;
    el.classList.add('pressed');
    startX = clientX;
    startY = clientY;
    const fieldRect = field.getBoundingClientRect();
    dragOffX = clientX - fieldRect.left - q.x;
    dragOffY = clientY - fieldRect.top - q.y;
    tgtX = q.x; tgtY = q.y;
    q.vx = 0; q.vy = 0;
    glideInk = null;
    stamp = null;
    try { stamp = buildStamp(el); } catch (err) { stamp = null; }
    lastStampX = q.x;
    lastStampY = q.y;
    wakeDist = 0;
    q.bobV -= MOTION.bob.hoverDip * 0.7;
    ringFor(q, MOTION.rings.pickup);
  }

  function moveDrag(clientX, clientY) {
    if (!dragEl) return;
    const dist = Math.hypot(clientX - startX, clientY - startY);
    if (!hasDragged && dist > dragThreshold) {
      // it has moved: no longer a press, now it's being carried
      hasDragged = true;
      playing = true;
      dragEl._word.pressed = false;
      dragEl.classList.remove('pressed');
      dragEl.classList.add('dragging');
    }
    if (!hasDragged) return;
    // it goes where the finger goes, as far as the edges of the water
    const fieldRect = field.getBoundingClientRect(), B = pond(), q = dragEl._word;
    tgtX = clamp(clientX - fieldRect.left - dragOffX, B.l, Math.max(B.l, B.r - q.w));
    tgtY = clamp(clientY - fieldRect.top - dragOffY, B.t, Math.max(B.t, B.b - q.h));
  }

  function endDrag() {
    if (!dragEl) return;
    const q = dragEl._word;
    q.pressed = false;
    dragEl.classList.remove('dragging', 'pressed');
    // it keeps the speed it had and glides to rest where it lands
    q.vx = clamp(q.vx * MOTION.drag.throwing, -18, 18); q.vy = clamp(q.vy * MOTION.drag.throwing, -18, 18);
    glideInk = hasDragged ? q : null;
    if (hasDragged) {
      // the splash: bigger the faster it was going
      const sp = Math.hypot(q.vx, q.vy);
      ringFor(q, MOTION.rings.splash, sp * 5);
      q.bobV += MOTION.bob.hoverDip * 1.3;
    }
    dragEl = null;
  }

  // the mouse crossing the water leaves a trail of small rings (a finger
  // is scrolling, so not on touch); while a word is dragged its own wake
  // does this instead
  let trailX = 0, trailY = 0, trailDist = 0;
  field.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || dragEl) return;
    const R = MOTION.rings.trail;
    const r = field.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    trailDist += Math.hypot(x - trailX, y - trailY);
    trailX = x; trailY = y;
    if (trailDist < R.every) return;
    trailDist = 0;
    ripple(x, y, R.reach + Math.random() * 8, R.life, R.alpha);
  });

  // a finger or a click on the water itself: a ring where it touched
  field.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.thing')) return;
    playing = true;
    const r = field.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const R = MOTION.rings.tap;
    ripple(x, y, R.reach, R.life, R.alpha);
    setTimeout(() => ripple(x, y, R.reach * R.second, R.life * 0.85, R.alpha * 0.6), 220);
  });

  // One set of pointer events for mouse, finger and pen alike.
  //
  // There used to be separate mouse and touch handlers, each opening the
  // link by script. A tap on a phone fires both — touchend, then the
  // browser's own copy of it as mouseup — so a tap opened the link twice.
  // And every click was cancelled so the script could do the opening,
  // which also cancelled the one the Enter key makes: from the keyboard,
  // nothing opened at all.
  //
  // Now nothing opens a link by script. A word that was only pressed lets
  // the browser's own click through, which opens it the way any link
  // opens — once, from a tap, a click, Enter, or ⌘-click. A word that was
  // carried has that click cancelled, so letting go of it isn't a visit.
  let dragPointer = null, suppressClickUntil = 0;
  field.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.thing');
    if (!el || dragEl) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;   // middle and right clicks stay the browser's
    e.preventDefault();       // no text selection starting under the word
    suppressClickUntil = 0;
    dragPointer = e.pointerId;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    startDrag(el, e.clientX, e.clientY, e.pointerType);
  });
  window.addEventListener('pointermove', (e) => {
    if (e.pointerId === dragPointer) moveDrag(e.clientX, e.clientY);
  });
  function release(e, cancelled) {
    if (e.pointerId !== dragPointer) return;
    dragPointer = null;
    // a carry, or a gesture the browser took away, is not a click
    if (hasDragged || cancelled) suppressClickUntil = performance.now() + 600;
    endDrag();
  }
  window.addEventListener('pointerup', (e) => release(e, false));
  window.addEventListener('pointercancel', (e) => release(e, true));
  field.addEventListener('click', (e) => {
    if (!e.target.closest('.thing')) return;
    if (performance.now() < suppressClickUntil) { e.preventDefault(); suppressClickUntil = 0; }
  });

  requestAnimationFrame(tick);

</script>
<svg class="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>
<script defer src="/petals.js"></script>

</body>
