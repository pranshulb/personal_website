# The presence room on Cloudflare (see worker.js). Deploy from this folder
# with `npx wrangler deploy`; README.md has the steps.
name = "pranshul-cafe-presence"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PresenceRoom"

# SQLite-backed, which is what Cloudflare's free plan allows. The room
# stores nothing; the class just has to be declared once.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceRoom"]
