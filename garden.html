<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <title>garden — pranshul's cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Princess+Sofia&family=Unkempt:wght@400;700&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #f5ede3;
      font-family: 'EB Garamond', Georgia, serif;
    }
    ::selection { background: rgba(224, 140, 160, 0.35); color: #4a2f1a; }
    canvas { position: fixed; top: 0; left: 0; display: block; }
    #bg { z-index: 1; }
    #fg { z-index: 2; }
    .grain {
      position: fixed; top: -50%; left: -50%;
      width: 200%; height: 200%;
      pointer-events: none; z-index: 3; opacity: 0.28;
    }
    .back {
      position: fixed; top: 1.5rem; left: 1.5rem;
      color: #b09a8a; text-decoration: none; font-size: 0.9rem;
      font-family: 'EB Garamond', serif; z-index: 10;
      border-bottom: none; transition: color 0.3s ease;
    }
    .back:hover { color: #3a2f2f; }
    .title {
      position: fixed; top: 1.5rem; right: 1.5rem;
      color: rgba(74, 47, 26, 0.22);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem; font-weight: 300;
      font-style: italic; letter-spacing: 0.06em;
      z-index: 10; pointer-events: none;
    }
    .hint {
      position: fixed; bottom: 1.5rem; left: 50%;
      transform: translateX(-50%);
      color: rgba(74, 47, 26, 0.28);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem; font-style: italic; font-weight: 300;
      z-index: 10; pointer-events: none;
      letter-spacing: 0.04em; white-space: nowrap;
      transition: opacity 2s ease;
    }
    .epigraph {
      position: fixed; bottom: 3.5rem; left: 50%;
      transform: translateX(-50%);
      color: rgba(74, 47, 26, 0.15);
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.75rem; font-style: italic; font-weight: 300;
      z-index: 10; pointer-events: none;
      letter-spacing: 0.08em; white-space: nowrap;
    }
    @media (max-width: 600px) {
      .title { font-size: 0.85rem; top: 1rem; right: 1rem; }
      .back { font-size: 0.9rem; top: 1rem; left: 1rem; }
      .hint { font-size: 0.72rem; bottom: 1rem; }
      .epigraph { font-size: 0.65rem; bottom: 2.5rem; }
    }

    /* ---- the visitors' book ---------------------------------------------- */
    .vb-open {
      position: fixed; top: 4.7rem; right: 1.6rem; z-index: 10;
      color: #b07a70; text-decoration: none; font-size: 1.02rem;
      border-bottom: 1px dashed rgba(196,122,122,0.45); transition: color 0.3s ease;
    }
    .vb-open:hover, .vb-open:focus-visible { color: #3a2f2f; }
    .vb {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(255,245,235,0.62);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
      animation: vbIn 0.35s ease;
    }
    .vb[hidden] { display: none; }
    @keyframes vbIn { from { opacity: 0; } to { opacity: 1; } }
    .vb-page {
      position: relative; max-width: 640px; width: calc(100% - 2rem);
      margin: 5vh auto 8vh; padding: 2.4rem 2.2rem 2.6rem;
      background: #faf5ef; color: #3a2f2f;
      border: 1px solid rgba(212,160,128,0.35); border-radius: 3px;
      box-shadow: 0 18px 50px rgba(74,48,32,0.14), 0 2px 6px rgba(74,48,32,0.06);
      line-height: 1.6;
    }
    .vb .vb-title {
      font-family: 'Princess Sofia', cursive !important; font-weight: 400; font-size: 2.6rem;
      line-height: 1.1; margin: 0 0 0.6rem; color: #4a3020;
    }
    .vb-close {
      position: absolute; top: 0.8rem; right: 1rem;
      background: none; border: 0; font-size: 1.7rem; line-height: 1; color: #b8a090; cursor: pointer; padding: 0.3rem 0.5rem;
    }
    .vb-close:hover, .vb-close:focus-visible { color: #c47a7a; }
    .vb-sub { color: #6a5545; font-size: 1rem; margin-bottom: 1.4rem; }
    .vb-form { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .vb-form input {
      flex: 1 1 14rem; min-width: 0; font-size: 1.1rem; padding: 0.55rem 0.8rem;
      border: 1px solid #d4b4a0; border-radius: 3px; background: #fffaf4; color: #3a2f2f;
    }
    .vb-form input:focus { outline: none; border-color: #c47a7a; box-shadow: 0 0 0 3px rgba(196,122,122,0.15); }
    .vb-hp { position: absolute !important; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    .vb button.vb-btn {
      font-size: 1.02rem; padding: 0.5rem 1.1rem; border-radius: 3px; cursor: pointer;
      border: 1px solid #c47a7a; background: #c47a7a; color: #fffaf4; transition: background 0.2s, color 0.2s;
    }
    .vb button.vb-btn:hover { background: #b06565; }
    .vb button.vb-btn.quiet { background: transparent; color: #c47a7a; }
    .vb button.vb-btn.quiet:hover { background: rgba(196,122,122,0.08); }
    .vb button.vb-btn:disabled { opacity: 0.5; cursor: default; }
    .vb button:focus-visible { outline: 2px solid #c47a7a; outline-offset: 2px; }
    .vb-preview { margin: 0.4rem 0 1.6rem; padding: 0.8rem 0 0.2rem; border-top: 1px dashed rgba(212,160,128,0.5); }
    .vb-preview[hidden] { display: none; }
    .vb-ink { display: block; width: 100%; height: 110px; }
    .vb-ink path, .vb-sig path { fill: none; stroke: #3a2f2f; stroke-linecap: round; stroke-linejoin: round; }
    .vb-status { min-height: 1.5em; font-size: 0.92rem; color: #9a7a60; margin: 0.3rem 0 0.7rem; }
    .vb-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .vb-actions[hidden] { display: none; }
    .vb-count { font-size: 0.95rem; color: #9a7a60; margin: 0.6rem 0 0.4rem; }
    .vb-list {
      list-style: none;
      /* ruled like the page of a book */
      background-image: linear-gradient(to bottom, transparent calc(100% - 1px), rgba(212,160,128,0.35) calc(100% - 1px));
      background-size: 100% 4.6rem;
    }
    .vb-list li { display: flex; align-items: flex-end; gap: 0.8rem; min-height: 4.6rem; padding: 0.35rem 0.2rem 0.45rem; font-size: 1rem; }
    .vb-list li.you .vb-sig path { stroke: #9c4f5a; }
    .vb-sig { height: 3.4rem; width: auto; max-width: 78%; flex: 0 1 auto; overflow: visible; }
    .vb-typed { font-size: 1.6rem; color: #3a2f2f; line-height: 1.2; max-width: 78%; overflow-wrap: anywhere; }
    .vb-when { margin-left: auto; font-size: 0.8rem; color: #b8a090; white-space: nowrap; padding-bottom: 0.2rem; }
    .vb-remove { background: none; border: 0; color: #c9a8a0; cursor: pointer; font-size: 0.8rem; padding: 0 0 0.2rem 0.3rem; }
    .vb-remove:hover { color: #c47a7a; }
    .vb-sig.pending path { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .vb-sig.draw path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: vbWrite 1.6s ease-out forwards; }
    @keyframes vbWrite { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .vb { animation: none; } .vb-sig.draw path { animation: none; stroke-dashoffset: 0; } }
    @media (max-width: 600px) {
      .vb-open { top: 4.3rem; right: 1.1rem; font-size: 0.95rem; }
      .vb-page { margin: 0; width: 100%; min-height: 100%; border-radius: 0; border: 0; padding: 2.2rem 1.3rem 2.4rem; }
      .vb .vb-title { font-size: 2.2rem; }
      .vb-sig { height: 2.9rem; max-width: 70%; }
      .vb-list { background-size: 100% 4rem; }
      .vb-list li { min-height: 4rem; }
    }
  </style>
  <script defer src="https://analytics.pranshul.cafe/script.js" data-website-id="fd5100ed-c3c1-4ee0-a84c-9cdf3feaaf1f"></script>

<style id="enola-font-override">
  body, body *{font-family:'Unkempt',cursive !important;}
  body h1, body h1 *, body .title{font-family:'Princess Sofia',cursive !important;font-weight:400 !important;font-size:2.2rem !important;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fg"></canvas>
<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>
<a href="/" class="back">← back</a>
<span class="title">pranshul's garden</span>
<a href="#visitors" class="vb-open" id="vb-open">sign the visitors' book</a>
<p class="epigraph">cherry blossoms fall at 5 centimeters per second</p>
<p class="hint">move to stir the wind · click to shake the tree</p>

<script>
(() => {
  const bgEl = document.getElementById('bg');
  const fgEl = document.getElementById('fg');
  const bgC = bgEl.getContext('2d');
  const fgC = fgEl.getContext('2d');

  let W, H, dpr;
  let mx = 0, my = 0, windX = 0, windY = 0;
  let shakeX = 0, shakeV = 0;
  let bgDirty = true, t = 0;
  let ambientPh = Math.random() * 100;

  // Data arrays
  let sortedBranches = [];
  let thickBranches = [];
  let blossoms = [];
  let airPetals = [];
  let groundPetals = [];
  let grass = [];
  let flowers = [];
  let birds = [];
  let motes = [];

  // Pre-rendered bokeh sprites
  let bokehSprites = [];
  let bokehState = [];

  const PINKS = ['#f2b5c4','#eda5b5','#e89aab','#f7cdd7','#fce4ec','#f5bfcd','#edb0c0','#fdd5de','#f0c8d2','#fff0f3'];
  const DEEP = ['#d4798d','#c96b7f','#e07a92','#cc7088'];
  const BARK = ['#3a2410','#4a2f1a','#5c3a24','#6b4430','#7a5040','#8a6050'];

  const pick = a => a[Math.floor(Math.random()*a.length)];
  const rng = (a,b) => a+Math.random()*(b-a);
  const qB = (a,b,c,t) => (1-t)*(1-t)*a+2*(1-t)*t*b+t*t*c;

  // Unified wind sway — higher = more movement
  const invGround = 1 / (0.73); // precompute
  function sw(y, x, ph) {
    const n = Math.max(0, (H*0.88-y)*invGround/H);
    const p = n*n;
    return windX*p*9 + Math.sin(t*0.35+(ph||x*0.007))*p*2.5 + shakeX*p;
  }

  // ── RESIZE ──
  function resize() {
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    bgEl.width = fgEl.width = W*dpr;
    bgEl.height = fgEl.height = H*dpr;
    bgEl.style.width = fgEl.style.width = W+'px';
    bgEl.style.height = fgEl.style.height = H+'px';
    bgC.setTransform(dpr,0,0,dpr,0,0);
    fgC.setTransform(dpr,0,0,dpr,0,0);
    genTree(); genGrass(); initBokeh(); initBirds(); initMotes();
    groundPetals = [];
    bgDirty = true;
  }

  // ── TREE — lighter generation ──
  function genTree() {
    const raw = []; blossoms = [];
    const sc = Math.min(W,H)/820;
    const bx = W*rng(0.44,0.56), by = H*0.91;
    const th = H*rng(0.30,0.37);
    grow(raw, bx, by, bx+rng(-10,10), by-th, 24*sc, 0);

    // Sort once, split thick for bark
    raw.sort((a,b) => a.d-b.d);
    sortedBranches = raw;
    thickBranches = raw.filter(b => b.w >= 6);
  }

  function grow(out, x1, y1, x2, y2, w, d) {
    if (d > 8 || w < 0.8) return;
    const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
    if (len<3) return;
    const ang = Math.atan2(dy,dx);
    const bend = rng(-1,1)*len*0.22;
    const perp = ang+Math.PI/2;
    const cx=(x1+x2)/2+Math.cos(perp)*bend, cy=(y1+y2)/2+Math.sin(perp)*bend;

    out.push({x1,y1,cx,cy,x2,y2,w,d});

    // Blossoms along thin branches — fewer, bigger
    if (w < 9 && d > 2) {
      const n = Math.floor(rng(1,4));
      for (let i=0;i<n;i++) {
        const bt=rng(0.35,1), sp=12+w*2;
        blossoms.push({
          x:qB(x1,cx,x2,bt)+rng(-sp,sp), y:qB(y1,cy,y2,bt)+rng(-sp,sp),
          r:rng(3,9), color:Math.random()<0.2?pick(DEEP):pick(PINKS),
          ph:Math.random()*6.28, swPh:Math.random()*6.28
        });
      }
    }
    // Tip clusters — moderate
    if (w < 5 && d > 3) {
      const n = Math.floor(rng(3,7));
      for (let i=0;i<n;i++) {
        blossoms.push({
          x:x2+rng(-18,18), y:y2+rng(-18,18),
          r:rng(3.5,9), color:Math.random()<0.25?pick(DEEP):pick(PINKS),
          ph:Math.random()*6.28, swPh:Math.random()*6.28
        });
      }
    }

    // Children — controlled count
    let nk;
    if (d===0) nk=Math.floor(rng(3,5));
    else if (d<3) nk=Math.floor(rng(2,3));
    else nk = 1 + (Math.random()<0.35?1:0);

    for (let i=0;i<nk;i++) {
      let ca;
      if (d===0) {
        ca = -Math.PI/2+((i/Math.max(nk-1,1))-0.5)*2.4+rng(-0.2,0.2);
      } else {
        ca = ang+rng(-0.55,0.55);
        if (d>4) ca+=0.12;
        if (ca>1.1) ca=1.1;
      }
      const cl=len*rng(0.45,0.7), cw=w*rng(0.5,0.68);
      const bt=d===0?rng(0.6,0.95):rng(0.5,1);
      const bx=qB(x1,cx,x2,bt), by_=qB(y1,cy,y2,bt);
      grow(out, bx, by_, bx+Math.cos(ca)*cl, by_+Math.sin(ca)*cl, cw, d+1);
    }
  }

  // ── GRASS & FLOWERS ──
  function genGrass() {
    grass=[]; flowers=[];
    const gY=H*0.87;
    for (let i=0;i<100;i++) {
      const gx=Math.random()*W;
      grass.push({
        x:gx, y:gY+Math.sin(gx*0.012)*6+Math.random()*(H-gY)*0.45,
        h:rng(4,14), bx:rng(-5,5), tx:rng(-3,3),
        col:`rgba(${60+Math.floor(rng(0,35))},${95+Math.floor(rng(0,35))},${45+Math.floor(rng(0,25))},${rng(0.1,0.22).toFixed(2)})`
      });
    }
    for (let i=0;i<25;i++) {
      const fx=Math.random()*W;
      flowers.push({
        x:fx, y:gY+Math.sin(fx*0.012)*6+rng(2,(H-gY)*0.35),
        r:rng(1.2,2.8), color:pick(['#f2b5c4','#eda5b5','#fce4ec','#e8d0a0','#d4c490','#c8dca0']),
        a:rng(0.18,0.38)
      });
    }
  }

  // ── BOKEH — pre-rendered to offscreen canvases ──
  function initBokeh() {
    bokehSprites=[]; bokehState=[];
    for (let i=0;i<4;i++) {
      const r=rng(25,50);
      const oc=document.createElement('canvas');
      const s=Math.ceil(r*2*dpr)+4;
      oc.width=s; oc.height=s;
      const ctx=oc.getContext('2d');
      ctx.scale(dpr,dpr);
      const cr=r+2/dpr, col=pick(PINKS);
      const g=ctx.createRadialGradient(cr,cr,0,cr,cr,r);
      g.addColorStop(0,col); g.addColorStop(0.5,col+'30'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cr,cr,r,r*0.6,0,0,Math.PI*2); ctx.fill();
      bokehSprites.push({canvas:oc, r, w:s/dpr, h:s/dpr});
      bokehState.push({
        x:rng(-50,W+50), y:rng(0,H), vx:rng(0.04,0.15), vy:rng(0.02,0.08),
        alpha:rng(0.04,0.08), ph:Math.random()*6.28
      });
    }
  }

  // ── BIRDS ──
  function initBirds() {
    birds=[];
    for (let i=0;i<3;i++) {
      birds.push({
        x:rng(-W*0.3,W*1.3), y:rng(H*0.08,H*0.4),
        vx:rng(0.25,0.65)*(Math.random()>0.5?1:-1),
        wingPh:Math.random()*6.28, wingSpd:rng(0.07,0.12),
        size:rng(3,5), alpha:rng(0.12,0.22)
      });
    }
  }

  // ── MOTES ──
  function initMotes() {
    motes=[];
    for (let i=0;i<15;i++) {
      motes.push({
        x:rng(0,W), y:rng(H*0.08,H*0.7),
        vx:rng(-0.07,0.07), vy:rng(-0.03,0.03),
        r:rng(0.6,1.3), ph:Math.random()*6.28, alpha:rng(0.12,0.28)
      });
    }
  }

  // ── PETALS ──
  function spawnPetal(fromTree) {
    let px,py,vx,vy;
    if (fromTree && blossoms.length) {
      const b=blossoms[Math.floor(Math.random()*blossoms.length)];
      px=b.x+sw(b.y,b.x,b.swPh)+rng(-5,5); py=b.y+rng(-5,5);
      vx=rng(-2,2); vy=rng(-0.5,1);
    } else {
      px=rng(-W*0.1,W*1.1); py=rng(-50,-10);
      vx=rng(-0.3,0.3); vy=rng(0.15,0.35);
    }
    airPetals.push({
      x:px, y:py, vx, vy,
      r:rng(2.5,5.5), rot:Math.random()*6.28, rotV:rng(-0.04,0.04),
      tumble:Math.random()*6.28, tumSpd:rng(0.015,0.04),
      swp:Math.random()*6.28, swSpd:rng(0.005,0.015), swAmp:rng(0.1,0.4),
      color:Math.random()<0.15?pick(DEEP):pick(PINKS),
      alpha:rng(0.3,0.6)
    });
  }

  function updatePetals() {
    ambientPh+=0.002;
    const amb=Math.sin(ambientPh)*0.25+Math.sin(ambientPh*2.7)*0.1;
    windX+=((mx*1.8+amb)-windX)*0.018;
    windY+=(my*0.4-windY)*0.018;

    for (let i=airPetals.length-1;i>=0;i--) {
      const p=airPetals[i];
      p.vx+=windX*0.006+Math.sin(t*0.55+p.swp)*0.002;
      p.vy+=0.005;
      p.swp+=p.swSpd;
      p.vx+=Math.sin(p.swp)*p.swAmp*0.006;
      p.vx*=0.993; p.vy*=0.997;
      p.x+=p.vx; p.y+=p.vy;
      p.rot+=p.rotV; p.tumble+=p.tumSpd;
      const gy=H*0.87+Math.sin(p.x*0.012)*6;
      if (p.y>gy) {
        if (groundPetals.length<200) {
          groundPetals.push({
            x:p.x, y:gy+rng(0,4), r:p.r*rng(0.6,0.85),
            rot:p.rot, color:p.color, alpha:p.alpha*0.4, age:0
          });
        }
        airPetals.splice(i,1); continue;
      }
      if (p.x<-80||p.x>W+80||p.y<-100) airPetals.splice(i,1);
    }
    for (let i=groundPetals.length-1;i>=0;i--) {
      groundPetals[i].age+=0.00015;
      if (groundPetals[i].age>1) groundPetals.splice(i,1);
    }
    if (airPetals.length<50&&Math.random()<0.2) spawnPetal(Math.random()<0.65);
  }

  // ── SHAKE ──
  function updateShake() {
    if (shakeX!==0||shakeV!==0) {
      shakeV-=shakeX*0.1; shakeV*=0.86; shakeX+=shakeV;
      if (Math.abs(shakeX)<0.03&&Math.abs(shakeV)<0.03){shakeX=0;shakeV=0;}
    }
  }

  // ── BACKGROUND (static) ──
  function drawBg() {
    const c=bgC;
    c.clearRect(0,0,W,H);
    // Sky
    const sky=c.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#ddd0e3'); sky.addColorStop(0.2,'#e5d2da');
    sky.addColorStop(0.4,'#f0dbd0'); sky.addColorStop(0.6,'#f5e4d8');
    sky.addColorStop(1,'#f5ede3');
    c.fillStyle=sky; c.fillRect(0,0,W,H);
    // Sun glow
    const sg=c.createRadialGradient(W*0.78,H*0.04,0,W*0.78,H*0.04,Math.min(W,H)*0.4);
    sg.addColorStop(0,'rgba(255,232,200,0.1)'); sg.addColorStop(0.5,'rgba(255,222,195,0.04)');
    sg.addColorStop(1,'rgba(255,222,195,0)');
    c.fillStyle=sg; c.fillRect(0,0,W,H);
    // Washes
    c.globalAlpha=1;
    [[W*0.15,H*0.08,W*0.24,H*0.13,'rgba(215,185,205,0.07)'],
     [W*0.72,H*0.1,W*0.2,H*0.11,'rgba(235,200,190,0.06)'],
     [W*0.45,H*0.2,W*0.3,H*0.16,'rgba(225,195,210,0.05)'],
     [W*0.88,H*0.05,W*0.14,H*0.08,'rgba(210,180,195,0.06)']
    ].forEach(([x,y,rx,ry,col])=>{
      c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fillStyle=col;c.fill();
    });
    // Hills
    [[H*0.68,'rgba(195,185,170,0.17)',0.003,35,0],
     [H*0.73,'rgba(185,178,162,0.14)',0.004,28,1.5],
     [H*0.77,'rgba(178,170,155,0.11)',0.005,22,3]
    ].forEach(([by,col,f,a,o])=>{
      c.fillStyle=col;c.beginPath();c.moveTo(-10,H);
      for(let x=-10;x<=W+10;x+=10)c.lineTo(x,by+Math.sin(x*f+o)*a+Math.sin(x*f*2.3+o*1.7)*a*0.4);
      c.lineTo(W+10,H);c.closePath();c.fill();
    });
    // Ground
    const gY=H*0.87;
    const grd=c.createLinearGradient(0,gY-10,0,H);
    grd.addColorStop(0,'#cdbf9f');grd.addColorStop(0.3,'#c4b595');grd.addColorStop(1,'#b5a580');
    c.fillStyle=grd;c.beginPath();c.moveTo(-10,H);
    for(let x=-10;x<=W+10;x+=8)c.lineTo(x,gY+Math.sin(x*0.012)*6+Math.sin(x*0.025)*3);
    c.lineTo(W+10,H);c.closePath();c.fill();
    // Grass
    c.lineWidth=1;
    for(const g of grass){c.strokeStyle=g.col;c.beginPath();c.moveTo(g.x,g.y);c.quadraticCurveTo(g.x+g.bx,g.y-g.h*0.6,g.x+g.tx,g.y-g.h);c.stroke();}
    // Flowers
    for(const f of flowers){c.globalAlpha=f.a;c.beginPath();c.arc(f.x,f.y,f.r,0,6.28);c.fillStyle=f.color;c.fill();}
    c.globalAlpha=1;
  }

  // ── FOREGROUND (every frame) ──
  function drawFg() {
    const c=fgC;
    c.clearRect(0,0,W,H);

    // Shadow
    let sx=0,cnt=0,mnX=W,mxX=0;
    for(const b of sortedBranches){
      if(b.d>1){const s=sw(b.y2,b.x2);sx+=b.x2+s;mnX=Math.min(mnX,b.x2+s);mxX=Math.max(mxX,b.x2+s);cnt++;}
    }
    if(cnt){
      const cx=sx/cnt,rx=Math.max((mxX-mnX)/2,50)*0.7,sy=H*0.886;
      const g=c.createRadialGradient(cx,sy,0,cx,sy,rx);
      g.addColorStop(0,'rgba(50,35,25,0.05)');g.addColorStop(0.7,'rgba(50,35,25,0.02)');
      g.addColorStop(1,'rgba(50,35,25,0)');
      c.fillStyle=g;c.beginPath();c.ellipse(cx,sy,rx,rx*0.13,0,0,6.28);c.fill();
    }

    // Branches with sway
    c.lineCap='round'; c.lineJoin='round';
    for(const b of sortedBranches){
      const s1=sw(b.y1,b.x1)*0.4, s2=sw(b.y2,b.x2), sc=(s1+s2)*0.5;
      c.beginPath();c.moveTo(b.x1+s1,b.y1);
      c.quadraticCurveTo(b.cx+sc,b.cy,b.x2+s2,b.y2);
      c.strokeStyle=BARK[Math.min(b.d,5)];c.lineWidth=b.w;c.stroke();
    }
    // Bark texture — only thickest
    c.globalAlpha=0.08;c.strokeStyle='#1a0e05';
    for(const b of thickBranches){
      const s1=sw(b.y1,b.x1)*0.4,s2=sw(b.y2,b.x2),sc=(s1+s2)*0.5;
      const off=Math.sin(b.x1*0.1)*b.w*0.3;
      c.beginPath();c.moveTo(b.x1+s1+off,b.y1);
      c.quadraticCurveTo(b.cx+sc+off,b.cy,b.x2+s2+off,b.y2);
      c.lineWidth=0.6;c.stroke();
    }
    c.globalAlpha=1;

    // Blossoms — simple circles, 5-petal only for biggest
    for(const b of blossoms){
      const pulse=1+Math.sin(t*1.1+b.ph)*0.1;
      const s=sw(b.y,b.x,b.swPh);
      const r=b.r*pulse, bx=b.x+s;

      if(r>6){
        // 5-petal flower
        c.globalAlpha=0.55;
        const pr=r*0.48,d=r*0.25;
        for(let i=0;i<5;i++){
          const a=b.ph+(i/5)*6.28;
          c.beginPath();c.ellipse(bx+Math.cos(a)*d,b.y+Math.sin(a)*d,pr,pr*0.6,a,0,6.28);
          c.fillStyle=b.color;c.fill();
        }
        // center
        c.globalAlpha=0.4;c.beginPath();c.arc(bx,b.y,r*0.08,0,6.28);
        c.fillStyle='#e0b840';c.fill();
      } else {
        // Simple circle
        c.globalAlpha=r>4?0.5:0.38;
        c.beginPath();c.arc(bx,b.y,r,0,6.28);
        c.fillStyle=b.color;c.fill();
      }
    }
    c.globalAlpha=1;

    // Birds
    c.strokeStyle='#4a3a30';c.lineWidth=0.8;c.lineCap='round';
    for(const bird of birds){
      bird.x+=bird.vx+windX*0.04;
      bird.y+=Math.sin(t*0.3+bird.wingPh)*0.08;
      bird.wingPh+=bird.wingSpd;
      if(bird.vx>0&&bird.x>W+60)bird.x=-60;
      if(bird.vx<0&&bird.x<-60)bird.x=W+60;
      const wu=Math.sin(bird.wingPh),s=bird.size;
      c.save();c.translate(bird.x,bird.y);
      if(bird.vx<0)c.scale(-1,1);
      c.globalAlpha=bird.alpha;
      c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-s*0.4,-s*wu*0.5,-s,-s*wu*0.3);c.stroke();
      c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(s*0.4,-s*wu*0.5,s,-s*wu*0.3);c.stroke();
      c.restore();
    }

    // Motes
    c.fillStyle='#ecc860';
    for(const m of motes){
      m.x+=m.vx+windX*0.02; m.y+=m.vy+Math.sin(t+m.ph)*0.012; m.ph+=0.008;
      const tw=0.4+Math.sin(t*1.5+m.ph)*0.6;
      c.globalAlpha=m.alpha*Math.max(0,tw);
      c.beginPath();c.arc(m.x,m.y,m.r,0,6.28);c.fill();
      if(m.x<-10)m.x=W+10; if(m.x>W+10)m.x=-10;
      if(m.y<H*0.05)m.y=H*0.65; if(m.y>H*0.72)m.y=H*0.08;
    }
    c.globalAlpha=1;

    // Ground petals
    for(const p of groundPetals){
      const a=p.alpha*Math.max(0,1-p.age);
      if(a>0.02) drawPetal(c,p.x,p.y,p.r,p.rot,p.color,a,0);
    }
    // Air petals
    for(const p of airPetals) drawPetal(c,p.x,p.y,p.r,p.rot,p.color,p.alpha,p.tumble);

    // Bokeh (pre-rendered sprites)
    for(let i=0;i<bokehState.length;i++){
      const b=bokehState[i],sp=bokehSprites[i];
      b.x+=b.vx+windX*0.01; b.y+=b.vy; b.ph+=0.006;
      c.globalAlpha=b.alpha*(0.7+Math.sin(b.ph)*0.3);
      c.drawImage(sp.canvas, b.x-sp.w/2, b.y-sp.h/2, sp.w, sp.h);
      if(b.x>W+sp.r+30){b.x=-sp.r-30;b.y=rng(0,H);}
      if(b.y>H+sp.r+30){b.y=-sp.r-30;b.x=rng(0,W);}
    }
    c.globalAlpha=1;
  }

  function drawPetal(c,x,y,sz,rot,color,alpha,tumble) {
    if(alpha<0.02)return;
    c.save();c.translate(x,y);c.rotate(rot);
    const sx=tumble?Math.cos(tumble):1;
    c.scale(sx||0.01,1);
    c.globalAlpha=alpha;c.fillStyle=color;
    c.beginPath();c.moveTo(0,-sz);
    c.bezierCurveTo(sz*0.6,-sz*0.7,sz*0.55,sz*0.4,0,sz*0.8);
    c.bezierCurveTo(-sz*0.55,sz*0.4,-sz*0.6,-sz*0.7,0,-sz);
    c.fill();
    c.restore();
  }

  // ── LOOP ──
  function frame() {
    t+=0.016; updatePetals(); updateShake();
    if(bgDirty){drawBg();bgDirty=false;}
    drawFg();
    requestAnimationFrame(frame);
  }

  // ── EVENTS ──
  window.addEventListener('resize',resize);
  document.addEventListener('mousemove',e=>{mx=(e.clientX/W-0.5)*2;my=(e.clientY/H-0.5)*2;});
  document.addEventListener('click',e=>{
    if(e.target.closest('.back, .vb-open, .vb'))return;
    shakeV=(Math.random()>0.5?1:-1)*rng(9,14);
    for(let i=0;i<50;i++)spawnPetal(true);
  });
  document.addEventListener('touchmove',e=>{
    const tc=e.touches[0];mx=(tc.clientX/W-0.5)*2;my=(tc.clientY/H-0.5)*2;
  },{passive:true});
  document.addEventListener('touchstart',e=>{
    if(e.target.closest('.back, .vb-open, .vb'))return;
    shakeV=(Math.random()>0.5?1:-1)*rng(9,14);
    for(let i=0;i<50;i++)spawnPetal(true);
  },{passive:true});
  setTimeout(()=>{const h=document.querySelector('.hint');if(h)h.style.opacity='0';},7000);

  // ── INIT ──
  resize();
  for(let i=0;i<50;i++){
    spawnPetal(true);
    const p=airPetals[airPetals.length-1];
    p.y=rng(0,H*0.84);p.x=rng(0,W);
  }
  for(let i=0;i<50;i++){
    const gx=rng(0,W);
    groundPetals.push({
      x:gx, y:H*0.87+Math.sin(gx*0.012)*6+rng(0,H*0.08),
      r:rng(1.8,4.5), rot:Math.random()*6.28,
      color:pick(PINKS), alpha:rng(0.12,0.28), age:rng(0,0.35)
    });
  }
  frame();
})();
</script>
<div class="vb" id="vb" hidden role="dialog" aria-modal="true" aria-labelledby="vb-title">
  <div class="vb-page">
    <button type="button" class="vb-close" id="vb-close" aria-label="close the book">&times;</button>
    <h2 class="vb-title" id="vb-title">visitors' book</h2>
    <p class="vb-sub">leave your name and a pen will write it out for you. everyone who has been here is below.</p>
    <form class="vb-form" id="vb-form" autocomplete="off">
      <label class="vb-hp" for="vb-name">your name</label>
      <input id="vb-name" name="name" maxlength="40" placeholder="your name" required enterkeyhint="go">
      <input class="vb-hp" id="vb-website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" class="vb-btn" id="vb-write">write it</button>
    </form>
    <div class="vb-preview" id="vb-preview" hidden>
      <svg class="vb-ink" id="vb-ink" aria-hidden="true"></svg>
      <p class="vb-status" id="vb-status" aria-live="polite"></p>
      <div class="vb-actions" id="vb-actions" hidden>
        <button type="button" class="vb-btn" id="vb-sign">sign the book</button>
        <button type="button" class="vb-btn quiet" id="vb-again">write it again</button>
      </div>
    </div>
    <p class="vb-count" id="vb-count" aria-live="polite"></p>
    <ol class="vb-list" id="vb-list"></ol>
  </div>
</div>

<script>
/* ======================================================================
   THE VISITORS' BOOK
   Sign your name and a handwriting network writes it out, in your browser
   (visitors/hand-worker.js — Alex Graves' 2013 handwriting synthesis, weights
   from X-rayLaser's pytorch-handwriting-synthesis-toolkit, MIT). The pen
   strokes are kept (api/guestbook.js) so everyone sees the same signature.
   The ~3.8 MB network loads only when someone starts writing; reading the
   book is just the saved strokes, drawn as SVG.
====================================================================== */
(() => {
  const API = '/api/guestbook';
  const MODEL = '/visitors/hand-v1.bin';
  const $ = (id) => document.getElementById(id);
  const vb = $('vb'), list = $('vb-list'), countEl = $('vb-count'), form = $('vb-form'), nameIn = $('vb-name');
  const preview = $('vb-preview'), ink = $('vb-ink'), statusEl = $('vb-status'), actions = $('vb-actions');
  const writeBtn = $('vb-write'), signBtn = $('vb-sign'), againBtn = $('vb-again');
  const NS = 'http://www.w3.org/2000/svg';
  let worker = null, modelReady = false, job = 0, result = null, typedName = '', canRemove = false;
  let entries = null, lastFocus = null, parts = [], box = null, drawQueued = false;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

  // ---- open / close ----
  function open() {
    lastFocus = document.activeElement;
    vb.hidden = false;
    if (location.hash !== '#visitors') history.replaceState(null, '', '#visitors');
    setTimeout(() => nameIn.focus({ preventScroll: true }), 50);
    if (!entries) loadBook();
  }
  function close() {
    vb.hidden = true;
    job++;                                  // stop any writing in progress
    if (location.hash === '#visitors') history.replaceState(null, '', location.pathname + location.search);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  $('vb-open').addEventListener('click', (e) => { e.preventDefault(); open(); });
  $('vb-close').addEventListener('click', close);
  vb.addEventListener('click', (e) => { if (e.target === vb) close(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !vb.hidden) close(); });
  if (location.hash === '#visitors') open();

  // ---- drawing a signature ----
  // smooth ink: quadratic curves through the midpoints of the saved points
  function pathData(strokes) {
    let d = '';
    for (const s of strokes) {
      const n = s.length / 2;
      if (n < 2) continue;
      d += 'M' + s[0] + ' ' + s[1];
      if (n === 2) { d += 'L' + s[2] + ' ' + s[3]; continue; }
      for (let i = 1; i < n - 1; i++) {
        const x = s[2 * i], y = s[2 * i + 1], mx = (x + s[2 * i + 2]) / 2, my = (y + s[2 * i + 3]) / 2;
        d += 'Q' + x + ' ' + y + ' ' + mx + ' ' + my;
      }
      d += 'L' + s[2 * n - 2] + ' ' + s[2 * n - 1];
    }
    return d;
  }
  function signature(e) {
    if (!e.strokes) {
      const span = document.createElement('span');
      span.className = 'vb-typed'; span.textContent = e.name;
      return span;
    }
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'vb-sig');
    svg.setAttribute('viewBox', '0 0 ' + (e.w + 8) + ' ' + (e.h + 8));
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', e.name);
    const t = document.createElementNS(NS, 'title'); t.textContent = e.name; svg.appendChild(t);
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', pathData(e.strokes));
    path.setAttribute('pathLength', '1');
    path.setAttribute('stroke-width', String(Math.max(2.2, (e.h + 8) / 34)));
    svg.appendChild(path);
    return svg;
  }

  // ---- the book ----
  const mine = () => (store.get('vb-mine') || '').split(',').filter(Boolean);
  function row(e) {
    const li = document.createElement('li');
    li.dataset.id = e.id;
    if (mine().includes(e.id)) li.classList.add('you');
    li.appendChild(signature(e));
    const when = document.createElement('span');
    when.className = 'vb-when'; when.textContent = e.date || '';
    li.appendChild(when);
    if (canRemove) {
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'vb-remove'; x.textContent = 'remove';
      x.setAttribute('aria-label', 'remove ' + e.name);
      x.addEventListener('click', () => removeEntry(e, li));
      li.appendChild(x);
    }
    return li;
  }
  function showCount() {
    const n = entries.length;
    countEl.textContent = n === 0 ? 'no one has signed yet. be the first!'
      : n === 1 ? 'one person has signed the book' : n + ' people have signed the book';
  }
  // a signature stays unwritten until it scrolls into view, then writes itself
  const io = 'IntersectionObserver' in window && !reduceMotion ? new IntersectionObserver((seen) => {
    for (const s of seen) if (s.isIntersecting) { s.target.classList.replace('pending', 'draw'); io.unobserve(s.target); }
  }, { root: vb }) : null;
  function renderBook() {
    list.textContent = '';
    showCount();
    const frag = document.createDocumentFragment();
    for (const e of entries) {
      const li = row(e);
      const svg = li.querySelector('.vb-sig');
      if (io && svg) { svg.classList.add('pending'); io.observe(svg); }
      frag.appendChild(li);
    }
    list.appendChild(frag);
  }
  async function loadBook() {
    countEl.textContent = 'opening the book…';
    try {
      const res = await fetch(API, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      entries = data.entries || []; canRemove = !!data.canRemove;
      renderBook();
    } catch (e) {
      countEl.textContent = '';
      const a = document.createElement('button');
      a.type = 'button'; a.className = 'vb-btn quiet'; a.textContent = 'the book wouldn\'t open, try again';
      a.addEventListener('click', loadBook);
      countEl.appendChild(a);
    }
  }
  async function removeEntry(e, li) {
    if (!confirm('remove "' + e.name + '" from the book?')) return;
    const res = await fetch(API + '?id=' + encodeURIComponent(e.id), { method: 'DELETE' });
    if (res.ok) { entries = entries.filter((x) => x.id !== e.id); li.remove(); showCount(); }
    else alert('could not remove it (' + res.status + ')');
  }

  // ---- writing ----
  function ensureWorker() {
    if (worker) return;
    worker = new Worker('/visitors/hand-worker.js');
    worker.onmessage = onWorker;
    worker.onerror = () => { setStatus('the pen stopped working. reload the page to try again'); writeBtn.disabled = false; };
  }
  function setStatus(t) { statusEl.textContent = t; }
  // live ink: each part is drawn from its latest attempt as the points arrive
  function queueDraw() { if (!drawQueued) { drawQueued = true; requestAnimationFrame(drawLive); } }
  function drawLive() {
    drawQueued = false;
    let cursor = 0; const strokes = [];
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const pts of parts) {
      if (!pts || !pts.length) continue;
      let lo = Infinity, hi = -Infinity;
      for (const p of pts) { lo = Math.min(lo, p[0]); hi = Math.max(hi, p[0]); }
      let cur = [];
      for (const [x, y, up] of pts) {
        const X = x - lo + cursor, Y = y;          // the network's y points down already
        cur.push(X, Y);
        minX = Math.min(minX, X); maxX = Math.max(maxX, X); minY = Math.min(minY, Y); maxY = Math.max(maxY, Y);
        if (up) { if (cur.length >= 4) strokes.push(cur); cur = []; }
      }
      if (cur.length >= 4) strokes.push(cur);
      cursor += hi - lo + 26;
    }
    if (!strokes.length) { ink.textContent = ''; return; }
    // the box only grows, so the writing doesn't jump about as it goes
    box = box ? { x0: Math.min(box.x0, minX - 10), y0: Math.min(box.y0, minY - 10), x1: Math.max(box.x1, maxX + 10), y1: Math.max(box.y1, maxY + 10) }
              : { x0: minX - 10, y0: Math.min(minY - 10, -90), x1: Math.max(maxX + 10, 300), y1: Math.max(maxY + 10, 60) };
    ink.setAttribute('viewBox', box.x0 + ' ' + box.y0 + ' ' + (box.x1 - box.x0) + ' ' + (box.y1 - box.y0));
    ink.setAttribute('preserveAspectRatio', 'xMinYMid meet');
    ink.innerHTML = '<path stroke-width="' + Math.max(2.2, (box.y1 - box.y0) / 34) + '" d="' + pathData(strokes) + '"/>';
  }
  function showResult(r) {
    result = r;
    const e = r.strokes ? measure(r.strokes) : null;
    ink.textContent = '';
    if (e) {
      ink.setAttribute('viewBox', '0 0 ' + (e.w + 8) + ' ' + (e.h + 8));
      ink.innerHTML = '<path stroke-width="' + Math.max(2.2, (e.h + 8) / 34) + '" d="' + pathData(r.strokes) + '"/>';
    } else {
      ink.setAttribute('viewBox', '0 0 300 60');
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', '0'); t.setAttribute('y', '42'); t.setAttribute('font-size', '34'); t.setAttribute('fill', '#3a2f2f');
      t.textContent = typedName; ink.appendChild(t);
    }
    actions.hidden = false; writeBtn.disabled = false;
  }
  function measure(strokes) {
    let w = 0, h = 0;
    for (const s of strokes) for (let i = 0; i < s.length; i += 2) { w = Math.max(w, s[i]); h = Math.max(h, s[i + 1]); }
    return { w, h };
  }
  function onWorker(ev) {
    const m = ev.data;
    if (m.id !== undefined && m.id !== job) return;       // an old request
    if (m.type === 'ink') {
      modelReady = true;
      if (!parts[m.part] || parts[m.part].attempt !== m.attempt) { parts[m.part] = []; parts[m.part].attempt = m.attempt; }
      parts[m.part].push(...m.pts);
      if (!statusEl.dataset.again) setStatus('writing…');
      queueDraw();
    } else if (m.type === 'again') {
      parts[m.part] = [];
      statusEl.dataset.again = '1';
      setStatus('that came out wobbly, writing it again…');
      queueDraw();
    } else if (m.type === 'done') {
      delete statusEl.dataset.again;
      setStatus('like it? sign the book, or have it written again');
      showResult({ strokes: m.strokes });
    } else if (m.type === 'typed') {
      setStatus('the pen only knows the latin alphabet so far, so your name goes in as you typed it');
      showResult({ strokes: null });
    } else if (m.type === 'fail') {
      delete statusEl.dataset.again;
      // don't leave them stuck: they can have another go, or sign it as typed
      setStatus('the pen couldn\'t manage that one. have it written again, or sign it as you typed it');
      showResult({ strokes: null });
    } else if (m.type === 'error') {
      setStatus('the pen could not be fetched. check your connection and try again');
      writeBtn.disabled = false;
    }
  }
  function startWriting() {
    typedName = nameIn.value.trim().replace(/\s+/g, ' ');
    if (!typedName) { nameIn.focus(); return; }
    ensureWorker();
    job++; result = null; parts = []; box = null; ink.textContent = '';
    preview.hidden = false; actions.hidden = true; signBtn.hidden = false; writeBtn.disabled = true;
    delete statusEl.dataset.again;
    setStatus(modelReady ? 'writing…' : 'fetching the pen (about 4 MB, just this once)…');
    worker.postMessage({ type: 'write', id: job, text: typedName, url: MODEL });
  }
  form.addEventListener('submit', (e) => { e.preventDefault(); startWriting(); });
  againBtn.addEventListener('click', startWriting);
  nameIn.addEventListener('input', () => { if (result && nameIn.value.trim() !== typedName) { actions.hidden = true; setStatus('press "write it" to write the new name'); } });

  signBtn.addEventListener('click', async () => {
    if (!result) return;
    signBtn.disabled = true; againBtn.disabled = true;
    setStatus('signing…');
    try {
      const res = await fetch(API, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: typedName, strokes: result.strokes, website: $('vb-website').value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      if (data.entry) {
        store.set('vb-mine', mine().concat(data.entry.id).join(','));
        entries = [data.entry].concat(entries || []);
        renderBook();
      }
      preview.hidden = true; nameIn.value = ''; result = null;
      countEl.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
      setStatus('');
      countEl.textContent = 'thank you for signing ✿ ' + countEl.textContent;
    } catch (e) {
      setStatus(String(e.message || e));
    } finally {
      signBtn.disabled = false; againBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
