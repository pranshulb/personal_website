<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <title>writings — pranshul's cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Princess+Sofia&family=Unkempt:wght@400;700&display=block" rel="stylesheet">
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'EB Garamond', Georgia, serif;
      min-height: 100vh;
      color: #3a2f2f;
      line-height: 1.8;
      background: #faf5ef;
    }

    .container {
      max-width: 520px;
      margin: 0 0 0 2rem;
      padding: 5rem 1.5rem 3rem;
    }

    a { color: #3a2f2f; text-decoration-color: #ccc; text-underline-offset: 3px; }
    a:hover { text-decoration-color: #3a2f2f; }
    .back { font-size: 0.9rem; color: #b09a8a; margin-bottom: 2rem; display: inline-block; text-decoration: none; border-bottom: none; transition: color 0.3s ease; }
    .back:hover { color: #3a2f2f; }

    h1 {
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #b09a8a;
      font-style: italic;
      margin-bottom: 2.5rem;
    }
    .subtitle a {
      color: #c47a7a;
      text-decoration-color: #d4a0a0;
    }
    .subtitle a:hover {
      color: #3a2f2f;
      text-decoration-color: #3a2f2f;
    }

    .writing-list {
      list-style: none;
      padding: 0;
    }

    .writing-list li {
      padding: 0.6rem 0;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .writing-list li::before {
      content: '·';
      color: #c4a0a0;
      font-size: 1.4rem;
      line-height: 1;
    }

    .writing-list a {
      text-decoration: none;
    }

    .writing-list a:hover {
      text-decoration: underline;
      text-decoration-color: #c4a0a0;
    }

    .tag {
      font-size: 0.7rem;
      color: #c4a0a0;
      border: 1px solid #e8ddd4;
      padding: 0.1rem 0.45rem;
      border-radius: 3px;
      letter-spacing: 0.03em;
    }


    .epigraph {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      font-size: 0.85rem;
      color: #c4a0a0;
      letter-spacing: 0.03em;
      margin: 0;
      z-index: 10;
    }

    @media (max-width: 640px) {
      .epigraph {
        position: relative;
        top: auto;
        right: auto;
        text-align: center;
        padding: 1.5rem 1.5rem 0;
        font-size: 0.8rem;
      }
      .container {
        margin: 0 auto;
        padding: 2.5rem 1.5rem 3rem;
      }
      h1 { font-size: 1.6rem; }
      .writing-list li { font-size: 1.05rem; }
    }
    /* the home page's paper grain */
    .grain {
      position: fixed; top: -50%; left: -50%;
      width: 200%; height: 200%;
      pointer-events: none; z-index: 8; opacity: 0.12;
    }
  </style>
  <script defer src="https://analytics.pranshul.cafe/script.js" data-website-id="fd5100ed-c3c1-4ee0-a84c-9cdf3feaaf1f"></script>

<style id="enola-font-override">
  body, body *{font-family:'Unkempt',cursive !important;}
  body h1, body h1 *, body .title{font-family:'Princess Sofia',cursive !important;font-weight:400 !important;font-size:2.2rem !important;}
</style>
</head>
<body>

<p class="epigraph"><em>cherry blossoms fall at 5 centimeters per second.</em></p>

<div class="container">
  <a href="/" class="back">← back</a>

  <h1>writings</h1>
  <p class="subtitle">I am thinking out loud and taking you through this journey with me.</p>

  <ul class="writing-list">
    <li><a href="/writings/passion">passion</a></li>
    <li><a href="/writings/feeling-empty">feeling empty</a></li>
    <li><a href="/writings/important-and-sadness">what's really important and about sadness</a></li>
    <li><a href="/writings/things-to-do-places-to-be">things to do, places to be</a></li>
    <li><a href="/writings/consume">consume</a></li>
    <li><a href="/writings/how-to-network">how to network</a></li>
  </ul>


</div>

<svg class="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>
<script defer src="/petals.js" data-ledges="h1, .writing-list a"></script>

</body>
</html>
