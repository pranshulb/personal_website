<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <title>writings — pranshul's cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Princess+Sofia&family=Unkempt:wght@400;700&display=block" rel="stylesheet">
  <style>
    /* ================================================================
       /page — the writings as a notebook whose pages turn.

       A trial of the writings page (September 2026): instead of scrolling
       down a column of scanned pages, the pages are bound into a book and
       turned. On a wide screen it is an open two-page spread; on a phone
       it is one page at a time, turning over a binding on the left.

       The turn is a real fold, not a card flipping: the corner you grab
       follows the pointer, the fold line is halfway between where the
       corner was and where it is now, the part beyond the fold is
       reflected across it (showing the back of the page), and the page
       underneath shows through where the turned part was. All of it is
       clip-path polygons and one matrix, recomputed per frame (frame()).
       ================================================================ */

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      color: #3a2f2f;
      background: #faf5ef;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .top { flex: none; position: relative; text-align: center; padding: 1.1rem 4.5rem 0; }
    .back {
      position: absolute; top: 1.5rem; left: 1.5rem;
      font-size: 0.9rem; color: #b09a8a; text-decoration: none;
      transition: color 0.3s ease; z-index: 10;
    }
    .back:hover { color: #3a2f2f; }
    h1.desk-title { font-weight: 400; line-height: 1.25; display: inline-block; }

    .epigraph {
      position: fixed; top: 1.5rem; right: 1.5rem;
      font-size: 0.85rem; color: #c4a0a0; letter-spacing: 0.03em; z-index: 10;
    }
    @media (max-width: 760px) { .epigraph { display: none; } }

    /* ---- the desk and the book ---- */
    .stage { flex: 1; position: relative; min-height: 0; }
    .book {
      position: absolute; left: 0; top: 0;
      width: calc(var(--pw) * 2); height: var(--ph);
      touch-action: pinch-zoom;      /* one finger turns pages; two still zoom */
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      opacity: 0; transition: opacity 0.5s ease;
    }
    .book.ready { opacity: 1; }
    .book.zoomed { touch-action: auto; }
    .book.dragging { cursor: grabbing; }

    .slot { position: absolute; top: 0; width: var(--pw); height: var(--ph); overflow: hidden; }
    .slot[hidden], .flap[hidden], .stack[hidden] { display: none; }
    .slot .holder { position: absolute; inset: 0; }
    #slotA { left: 0; z-index: 2; }
    #slotB { left: var(--pw); z-index: 2; }
    #slotU { z-index: 1; pointer-events: none; }
    #slotK { left: 0; transform-origin: 0 0; }
    .flap {
      position: absolute; left: 0; top: 0; width: calc(var(--pw) * 2); height: var(--ph);
      z-index: 4; pointer-events: none;
      filter: drop-shadow(0 0 calc(var(--u) * 1.1) rgba(45, 30, 25, 0.22));
    }

    /* the shading that makes a fold read as a fold: a shadow cast on the
       page underneath, along the fold, and a sheen on the turned-over part */
    .shade {
      position: absolute; left: 0; top: 0; height: 6000px; width: 10px;
      transform-origin: 0 0; pointer-events: none; opacity: 0;
    }
    .shade.cast { background: linear-gradient(to right, rgba(45, 30, 25, 0.34), rgba(45, 30, 25, 0.1) 35%, rgba(45, 30, 25, 0)); }
    .shade.sheen { background: linear-gradient(to right, rgba(70, 50, 40, 0.20) 0%, rgba(255, 252, 245, 0.22) 28%, rgba(255, 252, 245, 0) 75%); }

    /* the thickness of the pages still to come (right) and already read (left) */
    .stack { position: absolute; top: 0; width: var(--pw); height: var(--ph); background: #f7f1e8; border-radius: 2px; }
    #stackL { left: 0; }
    #stackR { left: var(--pw); }

    /* ---- the faces: what is printed on each side of a page ---- */
    .face { position: absolute; inset: 0; background: #fefcf8; overflow: hidden; }
    .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
    /* the gutter: pages darken a little where they curve into the binding */
    .face::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    .face.rside::after { background: linear-gradient(to right, rgba(58, 47, 47, 0.13), rgba(58, 47, 47, 0.03) 5%, rgba(58, 47, 47, 0) 11%); }
    .face.lside::after { background: linear-gradient(to left, rgba(58, 47, 47, 0.13), rgba(58, 47, 47, 0.03) 5%, rgba(58, 47, 47, 0) 11%); }
    .folio { position: absolute; bottom: 2.4%; font-size: calc(var(--u) * 3.1); color: #b8a090; z-index: 1; }
    .rside .folio { right: 5.5%; }
    .lside .folio { left: 5.5%; }

    /* the covers: dusty rose cloth, a paper label, an elastic strap */
    .face.cover, .face.backcover {
      background-color: #b98378;
      background-image:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(60, 30, 25, 0.05) 0 1px, transparent 1px 3px);
    }
    .face.cover { border-radius: 0 calc(var(--u) * 1.4) calc(var(--u) * 1.4) 0; box-shadow: inset calc(var(--u) * 1.6) 0 calc(var(--u) * 1.6) calc(var(--u) * -1.2) rgba(40, 20, 15, 0.45); }
    .face.backcover { border-radius: calc(var(--u) * 1.4) 0 0 calc(var(--u) * 1.4); box-shadow: inset calc(var(--u) * -1.6) 0 calc(var(--u) * 1.6) calc(var(--u) * -1.2) rgba(40, 20, 15, 0.45); }
    .face.cover::after, .face.backcover::after { display: none; }
    .strap { position: absolute; top: 0; bottom: 0; width: 3.6%; background: linear-gradient(90deg, #5c3833, #7d4c45 45%, #5c3833); box-shadow: 1px 0 2px rgba(0, 0, 0, 0.25); }
    .cover .strap { right: 9%; }
    .backcover .strap { left: 9%; }
    .cover .label {
      position: absolute; left: 17%; right: 17%; top: 31%;
      padding: 7% 4% 6%; text-align: center;
      background: #faf5ef; border: 1px solid #d4a080;
      box-shadow: 0 0 0 calc(var(--u) * 0.9) #faf5ef, 0 0 0 calc(var(--u) * 0.9 + 1px) #d4a080, 0 calc(var(--u) * 0.8) calc(var(--u) * 1.6) rgba(40, 20, 15, 0.3);
    }
    .book .lt, .book .c-title { font-family: 'Princess Sofia', cursive !important; font-weight: 400; }
    .cover .lt { display: block; font-size: calc(var(--u) * 10.5); line-height: 1.15; color: #3a2f2f; }
    .cover .lb { display: block; font-size: calc(var(--u) * 3.4); color: #6a5545; margin-top: calc(var(--u) * 1.5); letter-spacing: 0.04em; }
    .backcover .mark { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; font-size: calc(var(--u) * 2.8); color: rgba(250, 245, 239, 0.7); letter-spacing: 0.06em; }

    /* endpapers: sprigged paper, a slip of writing on it */
    .face.endpaper, .face.endpaper-back {
      background-color: #f6e8e2;
      background-image:
        radial-gradient(ellipse 3px 2px at 50% 50%, #eab8c2 60%, transparent 70%),
        radial-gradient(ellipse 2px 3px at 50% 50%, #efc9cf 60%, transparent 70%);
      background-size: 34px 34px, 34px 34px;
      background-position: 0 0, 17px 17px;
    }
    .slip {
      position: absolute; left: 13%; right: 13%; top: 38%;
      padding: 7% 6%; text-align: center; background: #fefcf8;
      box-shadow: 0 1px 3px rgba(58, 47, 47, 0.15);
      font-size: calc(var(--u) * 3.7); line-height: 1.55; color: #6a5545;
      transform: rotate(-1.4deg);
    }
    .endpaper-back .slip { top: 30%; transform: rotate(1.1deg); }
    .slip em { font-style: italic; }
    .slip .star { display: block; color: #d4a080; margin-bottom: calc(var(--u) * 2); }
    .slip button, .slip a {
      font: inherit; font-size: calc(var(--u) * 3.4); color: #c47a7a; background: none; border: 0;
      cursor: pointer; text-decoration: underline; text-decoration-color: #e0b8b0; text-underline-offset: 3px;
      display: inline-block; margin-top: calc(var(--u) * 3);
    }
    .slip button:hover, .slip a:hover { color: #3a2f2f; text-decoration-color: #3a2f2f; }
    .slip .sep { color: #d4bfb0; margin: 0 0.5em; }

    .face.blank .star, .face.paperback .star { position: absolute; left: 0; right: 0; top: 47%; text-align: center; color: #e0c8b4; font-size: calc(var(--u) * 3.4); }
    /* a page's back in the one-page view: blank, with the ink of the other
       side just showing through, the way it does in a real notebook */
    .face.paperback { background: #fbf7f1; }
    .face.paperback img.ghost { transform: scaleX(-1); opacity: 0.07; }

    /* the contents */
    .contents { padding: 13% 11% 8%; }
    .c-title { display: block; font-size: calc(var(--u) * 10); line-height: 1.15; margin-bottom: calc(var(--u) * 2.5); }
    .c-sub { font-size: calc(var(--u) * 3.5); line-height: 1.55; color: #b09a8a; font-style: italic; margin-bottom: calc(var(--u) * 7); }
    .toc { list-style: none; }
    .toc button {
      font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left;
      width: 100%; display: flex; align-items: baseline; gap: calc(var(--u) * 1.6);
      padding: calc(var(--u) * 1.7) 0; font-size: calc(var(--u) * 4.1); line-height: 1.35;
    }
    .toc .t { flex: 0 1 auto; }
    .toc .dots { flex: 1 0 calc(var(--u) * 4); border-bottom: 1px dotted #d4bfb0; transform: translateY(-0.28em); }
    .toc .num { flex: none; color: #b8a090; font-size: 0.8em; }
    .toc button:hover .t { text-decoration: underline; text-decoration-color: #c4a0a0; text-underline-offset: 3px; }
    .book button:focus-visible, .book a:focus-visible, .bar button:focus-visible { outline: 1px dotted #c47a7a; outline-offset: 3px; }

    /* ---- under the book: where you are, and a way to turn without the pages ---- */
    .bar {
      flex: none; height: 3.4rem; display: flex; align-items: center; justify-content: center; gap: 1.1rem;
      color: #b09a8a; font-size: 0.95rem; padding: 0 1rem;
    }
    .bar button {
      font: inherit; font-size: 1.35rem; line-height: 1; color: #b09a8a; background: none; border: 0;
      cursor: pointer; padding: 0.3rem 0.6rem; transition: color 0.2s ease, opacity 0.2s ease;
    }
    .bar button:hover { color: #3a2f2f; }
    .bar button:disabled { opacity: 0.25; cursor: default; color: #b09a8a; }
    .where { min-width: 12rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .where .pg { color: #c4b0a0; font-size: 0.85em; margin-left: 0.4em; }

    /* the home page's paper grain */
    .grain { position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; pointer-events: none; z-index: 8; opacity: 0.12; }
  </style>
  <script defer src="https://analytics.pranshul.cafe/script.js" data-website-id="fd5100ed-c3c1-4ee0-a84c-9cdf3feaaf1f"></script>

<style id="enola-font-override">
  body, body *{font-family:'Unkempt',cursive !important;}
  body h1, body h1 *, body .title{font-family:'Princess Sofia',cursive !important;font-weight:400 !important;font-size:2.2rem !important;}
</style>
</head>
<body>

<p class="epigraph"><em>cherry blossoms fall at 5 centimeters per second.</em></p>

<div class="top">
  <a href="/writings" class="back">← back</a>
  <h1 class="desk-title">writings</h1>
</div>

<main class="stage" id="stage">
  <div class="book" id="book" role="region" aria-label="the writings, as a book">
    <div class="stack" id="stackL" hidden></div>
    <div class="stack" id="stackR" hidden></div>
    <div class="slot" id="slotU" hidden><div class="holder"></div><div class="shade cast"></div></div>
    <div class="slot" id="slotA" hidden><div class="holder"></div></div>
    <div class="slot" id="slotB" hidden><div class="holder"></div></div>
    <div class="flap" id="flap" hidden>
      <div class="slot" id="slotK"><div class="holder"></div><div class="shade sheen"></div></div>
    </div>
  </div>
</main>

<nav class="bar" aria-label="turn the page">
  <button type="button" id="prev" aria-label="previous page">‹</button>
  <span class="where" id="where" aria-live="polite"></span>
  <button type="button" id="next" aria-label="next page">›</button>
</nav>

<svg class="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>

<script>
(() => {
  // The book's contents, in the order of the writings page. `pages` is how
  // many scanned pages each has: /writings/<slug>-1.svg … -<pages>.svg
  const WRITINGS = [
    { slug: 'passion', title: 'passion', pages: 3 },
    { slug: 'feeling-empty', title: 'feeling empty', pages: 5 },
    { slug: 'important-and-sadness', title: "what's really important and about sadness", pages: 5 },
    { slug: 'things-to-do-places-to-be', title: 'things to do, places to be', pages: 2 },
    { slug: 'consume', title: 'consume', pages: 6 },
    { slug: 'how-to-network', title: 'how to network', pages: 1 },
  ];

  // How a turn feels. Times in ms; distances are fractions of a page.
  const TURN = {
    ms: 780,            // a whole turn, from a tap, a key or the buttons
    quickMs: 380,       // a turn queued behind another (tapping fast)
    lift: 0.06,         // how far the corner rises mid-turn, as a fraction of the page's height
    dragDone: 0.3,      // let go of a dragged page with its corner this far past the middle and it turns (two-page view)
    flick: 0.35,        // …or moving this fast, in px per ms
    peekRadius: 90,     // how near a corner the mouse must be for the page to lift (desktop)
    peekLift: 70,       // how far it lifts
  };

  const AR = 595.28 / 841.89;          // an A4 page, which is what the scans are
  const $ = id => document.getElementById(id);
  const stage = $('stage'), book = $('book'), flap = $('flap');
  const slotA = $('slotA'), slotB = $('slotB'), slotU = $('slotU'), slotK = $('slotK');
  const stackL = $('stackL'), stackR = $('stackR');
  const castEl = slotU.querySelector('.shade'), sheenEl = slotK.querySelector('.shade');
  const prevBtn = $('prev'), nextBtn = $('next'), whereEl = $('where');
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* ---------------- the book: pages and leaves ----------------
     A page is one side of paper. A leaf is one sheet: a front (a right-hand
     page) and a back (the left-hand page it becomes once turned). The state
     `s` is how many leaves have been turned: the right page showing is
     leaves[s].front, the left page is leaves[s-1].back.

     Two-page view: pages pair up into leaves, a cover first, and each piece
     starts on a left-hand page so its first two pages open together (a
     blank with a small star fills in where needed).
     One-page view: every page is its own leaf with a blank back. */
  let spread = false, leaves = [], L = 0, maxS = 0, s = 0, W = 0, H = 0;

  function build(sp) {
    const P = [];
    P.push({ kind: 'cover', key: 'cover' });
    if (sp) P.push({ kind: 'endpaper', key: 'endpaper' });
    P.push({ kind: 'contents', key: 'contents' });
    let folio = 0;
    WRITINGS.forEach((w, wi) => {
      if (sp && P.length % 2 === 0) P.push({ kind: 'blank', key: 'blank' + P.length });
      for (let n = 1; n <= w.pages; n++) P.push({ kind: 'scan', wi, n, folio: ++folio, key: 'scan:' + wi + ':' + n });
    });
    if (sp && P.length % 2 === 1) P.push({ kind: 'blank', key: 'blank' + P.length });
    P.push({ kind: 'endpaper-back', key: 'end' });
    if (sp) P.push({ kind: 'backcover', key: 'backcover' });

    const out = [];
    if (sp) for (let i = 0; i < P.length; i += 2) out.push({ front: P[i], back: P[i + 1] });
    else P.forEach((d, i) => out.push({ front: d, back: { kind: 'paperback', of: d, key: 'pb' + i } }));
    out.forEach(l => { l.front.side = 'rside'; l.back.side = 'lside'; });
    return out;
  }
  // the first page of each piece, for the contents page's numbers
  const firstFolio = []; { let f = 1; WRITINGS.forEach(w => { firstFolio.push(f); f += w.pages; }); }

  /* ---------------- what is printed on each page ---------------- */
  const nodes = new Map();
  function nodeFor(d) {
    let el = nodes.get(d);
    if (el) return el;
    el = document.createElement('div');
    el.className = 'face ' + d.kind + ' ' + d.side;
    if (d.kind === 'scan') {
      const w = WRITINGS[d.wi], img = new Image();
      img.decoding = 'async'; img.draggable = false;
      img.alt = w.title + (w.pages > 1 ? ', page ' + d.n + ' of ' + w.pages : '');
      img.src = '/writings/' + w.slug + '-' + d.n + '.svg';
      const f = document.createElement('span'); f.className = 'folio'; f.textContent = d.folio;
      el.append(img, f);
    } else if (d.kind === 'paperback') {
      if (d.of.kind === 'scan') {
        const w = WRITINGS[d.of.wi], img = new Image();
        img.className = 'ghost'; img.alt = ''; img.decoding = 'async'; img.draggable = false;
        img.src = '/writings/' + w.slug + '-' + d.of.n + '.svg';
        el.append(img);
      }
    } else if (d.kind === 'cover') {
      el.innerHTML = '<div class="strap"></div><div class="label"><span class="lt">writings</span><span class="lb">pranshul</span></div>';
    } else if (d.kind === 'backcover') {
      el.innerHTML = '<div class="strap"></div><div class="mark">pranshul.cafe</div>';
    } else if (d.kind === 'endpaper') {
      el.innerHTML = '<p class="slip"><em>cherry blossoms fall at 5 centimeters per second.</em></p>';
    } else if (d.kind === 'endpaper-back') {
      el.innerHTML = '<div class="slip"><span class="star">✦</span>that\'s all, for now.<br>' +
        '<button type="button" data-go="contents">back to the contents</button><span class="sep">·</span><a href="/writings">all writings</a></div>';
    } else if (d.kind === 'blank') {
      el.innerHTML = '<span class="star">✦</span>';
    } else if (d.kind === 'contents') {
      el.classList.add('contents');
      el.innerHTML = '<span class="c-title">writings</span>' +
        '<p class="c-sub">I am thinking out loud and taking you through this journey with me.</p>' +
        '<ol class="toc">' + WRITINGS.map((w, i) =>
          '<li><button type="button" data-go="' + w.slug + '"><span class="t">' + w.title + '</span><span class="dots"></span><span class="num">' + firstFolio[i] + '</span></button></li>'
        ).join('') + '</ol>';
    }
    nodes.set(d, el);
    return el;
  }
  // put a page into a slot. Moving the same element between slots keeps its
  // image decoded, so a page never flashes blank when it changes slot.
  function show(slot, d) {
    const holder = slot.firstElementChild;
    if (!d) { slot.hidden = true; holder.replaceChildren(); return; }
    const n = nodeFor(d);
    if (n.parentNode !== holder) holder.replaceChildren(n);
    slot.hidden = false;
  }
  // start fetching the pages a turn or two away
  function preload() {
    for (let j = Math.max(0, s - 2); j <= Math.min(L - 1, s + 2); j++) { nodeFor(leaves[j].front); nodeFor(leaves[j].back); }
  }

  /* ---------------- size and place ---------------- */
  function layout() {
    const sw = stage.clientWidth, sh = stage.clientHeight - 6;
    const hSpread = Math.min(sh, (sw - 48) / 2 / AR);
    const hSingle = Math.min(sh, (sw - 32) / AR);
    // two pages side by side unless that would make them much smaller than one alone
    const sp = hSpread >= hSingle * 0.75;
    H = Math.max(120, Math.floor(sp ? hSpread : hSingle));
    W = Math.floor(H * AR);
    book.style.setProperty('--pw', W + 'px');
    book.style.setProperty('--ph', H + 'px');
    book.style.setProperty('--u', (W / 100) + 'px');
    if (sp !== spread || !leaves.length) {
      spread = sp; leaves = build(sp); L = leaves.length;
      maxS = spread ? L : L - 1;      // one page at a time: the last page stays, there is no back cover to close
    }
  }
  // a closed book sits in the middle of the desk, not off to one side
  const offsetFor = st => spread ? (st === 0 ? -W / 2 : st === L ? W / 2 : 0) : 0;
  function placeBook(off) {
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const spine = spread ? sw / 2 : (sw - W) / 2;
    book.style.transform = 'translate(' + (spine - W + off).toFixed(1) + 'px,' + Math.max(0, (sh - H) / 2).toFixed(1) + 'px)';
  }
  function paintStack(el, visible, count, dir) {
    if (!visible) { el.hidden = true; return; }
    el.hidden = false;
    const n = Math.min(5, Math.ceil(count / 2)), sh = [];
    for (let i = 1; i <= n; i++) sh.push((dir * i * 1.3).toFixed(1) + 'px ' + (i * 1).toFixed(1) + 'px 0 -0.4px ' + (i % 2 ? '#eee3d5' : '#e2d4c2'));
    sh.push((dir * 5) + 'px 16px 30px rgba(58, 47, 47, 0.16)');
    el.style.boxShadow = sh.join(',');
  }
  // state `left` has leaves[left-1].back on the left, with left-1 pages
  // beneath it; state `right` has leaves[right].front on the right, with
  // L-right-1 beneath it
  function stacks(left, right) {
    if (left != null) paintStack(stackL, spread && left > 0, left - 1, -1);
    if (right != null) paintStack(stackR, right < L, L - right - 1, 1);
  }

  function renderStatic() {
    slotA.style.clipPath = slotB.style.clipPath = '';
    slotA.style.zIndex = slotB.style.zIndex = '';
    // the pages that were turning become the pages at rest (moved, not rebuilt)
    show(slotA, spread && s > 0 ? leaves[s - 1].back : null);
    show(slotB, s < L ? leaves[s].front : null);
    show(slotU, null); show(slotK, null); flap.hidden = true;
    stacks(s, s);
    placeBook(offsetFor(s));
    ui();
    preload();
  }

  /* ---------------- the turn ----------------
     Worked in the turning page's own coordinates: the spine is x = 0, the
     page runs to x = W, and the corner being turned is C = (W, H). A top
     corner or a left-hand page is the same picture mirrored, which is all
     toBook / fromBook do. P is where the corner is now. */
  let mode = 'idle';          // idle | peek | drag | anim
  let turn = null, pending = 0, raf = 0;

  const canTurn = dir => dir > 0 ? s < maxS : s > 0;

  function begin(dir, corner, target) {
    if (target === undefined) target = s + dir;
    target = Math.max(0, Math.min(maxS, target));
    if (target === s || Math.sign(target - s) !== dir) return false;
    turn = { dir, corner, target, P: { x: W, y: H } };
    turn.leaf = dir > 0 ? slotB : slotA;           // the page being lifted
    turn.leafLeft = dir > 0 ? W : 0;
    turn.finalLeft = dir > 0 ? 0 : W;              // where its other side ends up
    if (dir > 0) {
      show(slotK, leaves[target - 1].back);
      show(slotU, target < L ? leaves[target].front : null);
      slotU.style.left = W + 'px';
      stacks(null, target);
    } else {
      show(slotK, leaves[target].front);
      show(slotU, spread && target > 0 ? leaves[target - 1].back : null);
      slotU.style.left = '0px';
      stacks(target, null);
      if (!spread) slotA.hidden = true;           // one page at a time: the page coming back arrives from off the edge
    }
    turn.leaf.style.zIndex = 3;
    flap.hidden = false;
    flap.style.visibility = 'hidden';
    return true;
  }

  function end(complete) {
    if (!turn) return;
    if (complete) s = turn.target;
    slotK.style.transform = slotK.style.clipPath = '';
    castEl.style.opacity = sheenEl.style.opacity = 0;
    turn = null; mode = 'idle';
    book.classList.remove('dragging');
    renderStatic();
    if (pending) { const d = pending; pending = 0; go(d, 'b', true); }
  }

  // the corner can't be pulled further from the spine than the paper reaches
  function constrain(p) {
    let x = p.x, y = Math.min(p.y, H);
    let d = Math.hypot(x, y - H);                   // from the spine's near end: at most the page's width
    if (d > W) { x = x * W / d; y = H + (y - H) * W / d; }
    const D = Math.hypot(W, H);
    d = Math.hypot(x, y);                           // from its far end: at most the diagonal
    if (d > D) { x = x * D / d; y = y * D / d; }
    return { x, y };
  }

  function clipRect(fn) {             // the part of a W×H page where fn >= 0, as a polygon
    const R = [[0, 0], [W, 0], [W, H], [0, H]], out = [];
    for (let i = 0; i < 4; i++) {
      const a = R[i], b = R[(i + 1) % 4], fa = fn(a), fb = fn(b);
      if (fa >= 0) out.push(a);
      if ((fa >= 0) !== (fb >= 0)) { const t = fa / (fa - fb); out.push([a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])]); }
    }
    return out.length < 3 ? 'polygon(0 0, 0 0, 0 0)' : 'polygon(' + out.map(p => p[0].toFixed(2) + 'px ' + p[1].toFixed(2) + 'px').join(',') + ')';
  }
  function band(el, q, dirv, width, opacity) {
    el.style.width = width.toFixed(1) + 'px';
    el.style.transform = 'translate(' + q.x.toFixed(2) + 'px,' + q.y.toFixed(2) + 'px) rotate(' + Math.atan2(dirv.y, dirv.x).toFixed(4) + 'rad) translate(0,-50%)';
    el.style.opacity = opacity.toFixed(3);
  }

  function frame(Pin) {
    const t = turn, dir = t.dir, cb = t.corner === 'b';
    const P = constrain(Pin); t.P = P;
    const toBook = (p, d) => ({ x: (d || dir) > 0 ? W + p.x : W - p.x, y: cb ? p.y : H - p.y });
    const fromBook = (X, Y, d) => ({ x: (d || dir) > 0 ? X - W : W - X, y: cb ? Y : H - Y });

    const prog = Math.min(1, Math.max(0, (W - P.x) / (2 * W)));
    placeBook(offsetFor(s) + (offsetFor(t.target) - offsetFor(s)) * prog);

    const dx = W - P.x, dy = H - P.y, dist = Math.hypot(dx, dy);
    if (dist < 0.5) { t.leaf.style.clipPath = ''; flap.style.visibility = 'hidden'; castEl.style.opacity = 0; return; }
    flap.style.visibility = '';
    const n = { x: dx / dist, y: dy / dist };                       // points from the fold towards where the corner was
    const Q = { x: (W + P.x) / 2, y: (H + P.y) / 2 };               // a point on the fold
    const side = p => (p.x - Q.x) * n.x + (p.y - Q.y) * n.y;        // > 0: the part that has been lifted over

    // the page being turned keeps only what hasn't been lifted
    t.leaf.style.clipPath = clipRect(v => 0.6 - side(fromBook(t.leafLeft + v[0], v[1])));
    // its other side: only the lifted part, reflected across the fold.
    // A point of that page, where it is on paper…
    const onPaper = (ex, ey) => fromBook(t.finalLeft + ex, ey, -dir);
    slotK.style.clipPath = clipRect(v => side(onPaper(v[0], v[1])) + 0.6);
    // …and where it shows: reflected across the fold. That is a rotation
    // and a shift, so one matrix places the whole page.
    const shown = (ex, ey) => { const p = onPaper(ex, ey), k = 2 * side(p); return toBook({ x: p.x - k * n.x, y: p.y - k * n.y }); };
    const o = shown(0, 0), ax = shown(1, 0), ay = shown(0, 1);
    slotK.style.transform = 'matrix(' + [ax.x - o.x, ax.y - o.y, ay.x - o.x, ay.y - o.y, o.x, o.y].map(v => v.toFixed(4)).join(',') + ')';

    const lifted = Math.sin(prog * Math.PI);
    // the shadow the lifted part casts on the page underneath, along the fold
    const qb = toBook(Q), nb = toBook({ x: Q.x + n.x, y: Q.y + n.y });
    band(castEl, { x: qb.x - t.leafLeft, y: qb.y }, { x: nb.x - qb.x, y: nb.y - qb.y },
      Math.max(6, Math.min(W * 0.22, dist * 0.25)), 0.2 + 0.6 * lifted);
    // and the light on the turned part, brightest just past the fold
    const back = p => { const b = toBook(p, -dir); return { x: b.x - t.finalLeft, y: b.y }; };
    const kq = back(Q), kn = back({ x: Q.x + n.x, y: Q.y + n.y });
    band(sheenEl, kq, { x: kn.x - kq.x, y: kn.y - kq.y }, Math.max(20, Math.min(W * 0.5, dist * 0.6)), 1);
  }

  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  function animate(to, complete, dur, lift, ease) {
    mode = 'anim';
    turn.anim = { from: { x: turn.P.x, y: turn.P.y }, to, t0: performance.now(), dur: reduced ? 0 : dur, lift, complete, ease };
    kick();
  }
  function kick() { if (!raf) raf = requestAnimationFrame(tick); }
  function tick(now) {
    raf = 0;
    if (mode === 'anim') {
      const a = turn.anim, k = a.dur ? Math.min(1, (now - a.t0) / a.dur) : 1, e = a.ease(k);
      frame({ x: a.from.x + (a.to.x - a.from.x) * e, y: a.from.y + (a.to.y - a.from.y) * e - a.lift * Math.sin(Math.PI * e) });
      if (k >= 1) end(a.complete); else kick();
    } else if (mode === 'peek') {
      const g = turn.goal, P = turn.P, x = P.x + (g.x - P.x) * 0.2, y = P.y + (g.y - P.y) * 0.2;
      frame({ x, y });
      if (g.x === W && g.y === H && Math.hypot(W - x, H - y) < 0.8) end(false); else kick();
    }
  }

  // turn the page: from the buttons, a tap, a key, the wheel
  function go(dir, corner, quick, target) {
    corner = corner || 'b';
    if (mode === 'drag') return;
    if (mode === 'anim') { if (target === undefined) pending = dir; return; }
    if (mode === 'peek') {
      if (turn.dir === dir && target === undefined) return settle(true);
      end(false);
    }
    if (!begin(dir, corner, target)) return;
    animate({ x: -W, y: H }, true, quick ? TURN.quickMs : TURN.ms, H * TURN.lift, easeInOut);
  }
  function goTo(state) { if (state !== s) go(Math.sign(state - s), 'b', false, state); }
  // finish a turn from wherever the corner is, or let it fall back
  function settle(complete) {
    const P = turn.P;
    if (complete) animate({ x: -W, y: H }, true, 170 + 420 * Math.max(0, P.x + W) / (2 * W), 0, easeOut);
    else animate({ x: W, y: H }, false, 140 + 320 * Math.max(0, W - P.x) / (2 * W), 0, easeOut);
  }

  /* ---------------- hands on the paper ----------------
     A press that doesn't move is a tap: the right page turns forward, the
     left page back (one page at a time: the left third goes back). A press
     that moves picks up the corner nearest to it and it follows the
     pointer; let go past the middle, or with a flick, and it turns. */
  let press = null, zoomed = false;
  function bookPoint(e) { const r = book.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  // A press on a button or link (the contents, the last page) can still
  // become a drag, so a swipe works from anywhere on the page; if it doesn't
  // move, the button's own click does the rest. The pointer is only captured
  // once it moves, or that click would go to the book instead of the button.
  book.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.ctrlKey || zoomed) return;
    if (mode === 'anim' || mode === 'drag') return;
    const onLink = !!e.target.closest('button, a');
    if (!onLink) e.preventDefault();
    const b = bookPoint(e);
    press = { id: e.pointerId, x: e.clientX, y: e.clientY, bx: b.x, by: b.y, moved: false, onLink, samples: [] };
  });

  book.addEventListener('pointermove', e => {
    if (!press || e.pointerId !== press.id) return;
    const dx = e.clientX - press.x, dy = e.clientY - press.y;
    if (!press.moved) {
      if (Math.hypot(dx, dy) < 6) return;
      press.moved = true;
      if (mode === 'peek') press.P0 = { x: turn.P.x, y: turn.P.y };
      else {
        const dir = spread ? (press.bx >= W ? 1 : -1) : (dx < 0 ? 1 : -1);    // one page: swipe left for the next
        if (!begin(dir, press.by > H / 2 ? 'b' : 't')) { press = null; return; }
        // one page at a time, going back: the page comes in from the binding, following the finger
        press.follow = !spread && dir < 0;
        press.P0 = press.follow ? { x: 0, y: H } : { x: W, y: H };
      }
      mode = 'drag';
      book.classList.add('dragging');
      try { book.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (mode !== 'drag') return;
    const lx = turn.dir > 0 ? dx : -dx, ly = turn.corner === 'b' ? dy : -dy;
    frame({ x: press.P0.x + lx, y: press.P0.y + ly * (press.follow ? 0.5 : 1) });
    press.samples.push({ t: e.timeStamp, x: turn.P.x });
    if (press.samples.length > 6) press.samples.shift();
  });

  function release(e, cancelled) {
    if (!press || e.pointerId !== press.id) return;
    const p = press; press = null;
    if (!p.moved) {
      if (cancelled || p.onLink) return;
      let dir = spread ? (p.bx >= W ? 1 : -1) : (p.bx - W < W * 0.3 ? -1 : 1);
      if (s === 0) dir = 1;                                   // the cover opens wherever you touch it
      go(dir, p.by > H / 2 ? 'b' : 't');
      return;
    }
    if (mode !== 'drag') return;
    // how fast the corner was moving as it was let go: only the last tenth of
    // a second counts, so a drag that stops and then lets go is not a flick
    const recent = p.samples.filter(q => e.timeStamp - q.t < 100);
    const a = recent[0], b = recent[recent.length - 1];
    const v = a && b && b.t > a.t ? (b.x - a.x) / (b.t - a.t) : 0;
    const P = turn.P;
    const done = spread ? W * TURN.dragDone : (turn.dir > 0 ? W * 0.5 : -W * 0.3);
    let complete = P.x < done;
    if (v < -TURN.flick) complete = true; else if (v > TURN.flick) complete = false;
    if (cancelled) complete = false;
    settle(complete);
  }
  book.addEventListener('pointerup', e => release(e, false));
  book.addEventListener('pointercancel', e => release(e, true));
  // only the book's own capture: a touch starts out captured by whatever the
  // finger landed on, and moving that capture to the book fires this for it
  book.addEventListener('lostpointercapture', e => { if (e.target === book && press && press.id === e.pointerId) release(e, true); });

  // the corner lifts a little when the mouse comes near it, so you know you can take it
  function hover(e) {
    if (!spread || !finePointer || press || mode === 'anim' || mode === 'drag') return;
    const b = bookPoint(e), R = Math.min(TURN.peekRadius, W * 0.2);
    const near = (x, y) => Math.hypot(b.x - x, b.y - y) < R;
    let dir = 0, corner = 'b';
    if (near(2 * W, H)) dir = 1; else if (near(2 * W, 0)) { dir = 1; corner = 't'; }
    else if (near(0, H)) dir = -1; else if (near(0, 0)) { dir = -1; corner = 't'; }
    if (dir && !canTurn(dir)) dir = 0;
    if (dir) {
      if (mode === 'peek' && (turn.dir !== dir || turn.corner !== corner)) end(false);
      if (mode === 'idle') { if (!begin(dir, corner)) return; mode = 'peek'; }
      const lx = dir > 0 ? b.x - W : W - b.x, ly = corner === 'b' ? b.y : H - b.y;
      let gx = Math.min(lx, W - 18), gy = Math.min(ly, H - 18);
      const d = Math.hypot(W - gx, H - gy);
      if (d > TURN.peekLift) { gx = W - (W - gx) * TURN.peekLift / d; gy = H - (H - gy) * TURN.peekLift / d; }
      turn.goal = { x: gx, y: gy };
      kick();
    } else if (mode === 'peek') { turn.goal = { x: W, y: H }; kick(); }
  }
  document.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && !e.buttons) hover(e); });
  document.addEventListener('mouseout', e => { if (!e.relatedTarget && mode === 'peek') { turn.goal = { x: W, y: H }; kick(); } });

  // the contents page and the last page have buttons that go somewhere
  book.addEventListener('click', e => {
    const btn = e.target.closest('button[data-go]');
    if (!btn || mode !== 'idle') return;
    goTo(stateOf(btn.dataset.go === 'contents' ? d => d.kind === 'contents' : d => d.kind === 'scan' && WRITINGS[d.wi].slug === btn.dataset.go && d.n === 1));
  });

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const onButton = e.target.closest && e.target.closest('button, a');
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey && !onButton)) { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey && !onButton)) { e.preventDefault(); go(-1); }
    else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    else if (e.key === 'End') { e.preventDefault(); goTo(maxS); }
  });

  // scrolling turns pages too, since that is what a hand does on this site.
  // A trackpad keeps sending after the fingers lift, so one swipe turns one page.
  let wheelAcc = 0, lastWheel = 0, lastWheelTurn = 0;
  window.addEventListener('wheel', e => {
    if (e.ctrlKey) return;                                    // a pinch on a trackpad: let it zoom
    e.preventDefault();
    const now = performance.now();
    if (now - lastWheel > 220) wheelAcc = 0;
    lastWheel = now;
    const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
    wheelAcc += (Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX) * k;
    if (Math.abs(wheelAcc) > 40 && now - lastWheelTurn > 800) { go(wheelAcc > 0 ? 1 : -1); lastWheelTurn = now; wheelAcc = 0; }
  }, { passive: false });

  // zoomed in with two fingers: one finger pans the zoomed page instead of turning it
  if (window.visualViewport) visualViewport.addEventListener('resize', () => {
    zoomed = visualViewport.scale > 1.02;
    book.classList.toggle('zoomed', zoomed);
  });

  /* ---------------- where you are ---------------- */
  function stateOf(pred) {
    for (let j = 0; j < L; j++) {
      if (pred(leaves[j].front)) return j;
      if (pred(leaves[j].back)) return Math.min(maxS, j + 1);
    }
    return -1;
  }
  function visible() {
    return [spread && s > 0 ? leaves[s - 1].back : null, s < L ? leaves[s].front : null].filter(Boolean);
  }
  function ui() {
    prevBtn.disabled = !canTurn(-1);
    nextBtn.disabled = !canTurn(1);
    const vis = visible(), scans = vis.filter(d => d.kind === 'scan');
    let label = '', pg = '';
    if (scans.length) {
      const w = WRITINGS[scans[0].wi], mine = scans.filter(d => d.wi === scans[0].wi).map(d => d.n);
      label = w.title;
      if (w.pages > 1) pg = (mine.length > 1 ? mine[0] + '–' + mine[mine.length - 1] : mine[0]) + ' / ' + w.pages;
      try { history.replaceState(null, '', '#' + w.slug); } catch (e) {}
    } else {
      const k = vis.map(d => d.kind);
      label = k.includes('cover') ? (finePointer ? 'click the cover, or lift its corner' : 'tap the cover to open it')
        : k.includes('contents') ? 'contents' : 'the end';
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }
    whereEl.textContent = label;
    if (pg) { const sp = document.createElement('span'); sp.className = 'pg'; sp.textContent = pg; whereEl.appendChild(sp); }
  }

  // keep your place when the window changes between one page and two
  function anchor() {
    const vis = visible();
    const d = vis.find(d => d.kind === 'scan') || vis[vis.length - 1] || vis[0];
    return d ? d.key : 'cover';
  }
  function relayout() {
    if (turn) { turn = null; mode = 'idle'; press = null; pending = 0; slotK.style.transform = ''; book.classList.remove('dragging'); }
    const key = anchor();
    layout();
    let st = stateOf(d => d.key === key);
    if (st < 0) st = key === 'endpaper' ? stateOf(d => d.kind === 'contents') : key === 'backcover' ? maxS : 0;
    s = Math.max(0, Math.min(maxS, st));
    renderStatic();
  }
  let resizeT = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(relayout, 120); });

  // start: at the piece named after the #, or at the closed cover
  layout();
  const slug = decodeURIComponent(location.hash.slice(1));
  const at = slug ? stateOf(d => d.kind === 'scan' && WRITINGS[d.wi].slug === slug && d.n === 1) : -1;
  s = at > 0 ? at : 0;
  renderStatic();
  requestAnimationFrame(() => book.classList.add('ready'));
  // the heading's font arrives late and changes its height, and with it the room for the book
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (mode === 'idle') relayout(); });

  window.BOOK = { go, goTo, get state() { return s; }, get maxState() { return maxS; }, get spread() { return spread; }, get mode() { return mode; } };
})();
</script>
<script defer src="/petals.js" data-ledges=".desk-title"></script>

</body>
