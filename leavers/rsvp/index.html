<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Same reason as the party page: cleanUrls means this can be served as
     /leavers/rsvp, where the ../ back-links below would otherwise land on the
     site root instead of the party. Update if the folder moves. -->
<base href="/leavers/rsvp/" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RSVP — Pranshul’s Leavers Party</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

<script>
/* ═══════════════════════════════════════════════════════════════
   THE ONLY LINE THAT MATTERS.
   Paste the real RSVP link between the quotes and everyone who
   hits /pranshul/rsvp/ gets whisked straight there.
   Leave it empty ("") to show the "opens soon" page instead.
   ═══════════════════════════════════════════════════════════════ */
const RSVP_URL = "";
</script>

<style>
  :root{
    --ink:#2b1b4d; --pink:#ff3d8b; --tang:#ff8a3d; --sun:#ffd23d;
    --mint:#3de0a0; --sky:#3dbbff; --grape:#a45cff; --cream:#fff3e0;
    --comic:"Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue","Marker Felt",cursive;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink); font-family:var(--comic); overflow:hidden;
    display:flex; align-items:center; justify-content:center; text-align:center;
    background:
      radial-gradient(58% 48% at 12% 10%, rgba(255,210,61,.92) 0%, rgba(255,210,61,0) 62%),
      radial-gradient(55% 48% at 88% 14%, rgba(255,61,139,.85) 0%, rgba(255,61,139,0) 62%),
      radial-gradient(58% 50% at 86% 88%, rgba(61,187,255,.85) 0%, rgba(61,187,255,0) 62%),
      radial-gradient(58% 50% at 10% 90%, rgba(61,224,160,.85) 0%, rgba(61,224,160,0) 62%),
      linear-gradient(155deg,#fff3e0 0%,#ffe6f2 42%,#e6f8ff 72%,#fff6d9 100%);
  }
  .rays{
    position:fixed; z-index:0; pointer-events:none; top:50%; left:50%;
    width:230vmax; height:230vmax; margin:-115vmax 0 0 -115vmax;
    background:repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,.62) 0deg 7deg, rgba(255,255,255,0) 7deg 14deg);
    animation:spin 55s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  main{ position:relative; z-index:1; padding:2rem; }
  h1{
    font-weight:700; line-height:.95; text-transform:uppercase; margin:0 0 .6em;
    font-size:clamp(2.4rem, 9vw, 6rem);
    color:var(--mint);
    -webkit-text-stroke:clamp(2px,.45vw,6px) var(--ink);
    paint-order:stroke fill;
    text-shadow:5px 5px 0 var(--grape), 10px 10px 0 var(--ink);
    transform:rotate(-1.6deg);
    animation:heave 5s ease-in-out infinite;
  }
  @keyframes heave{
    0%,100%{ transform:rotate(-1.6deg) scale(1) }
    50%    { transform:rotate(1.2deg)  scale(1.04) }
  }
  p{ font-size:clamp(1.05rem, 2.6vw, 1.5rem); font-weight:700; margin:.4em 0; }
  a.sticker{
    display:inline-block; margin-top:1.4em;
    font-weight:700; text-transform:uppercase; text-decoration:none;
    font-size:clamp(1.1rem, 3vw, 1.7rem);
    color:var(--ink); background:var(--sun);
    padding:.45em 1.1em .5em;
    border:4px solid var(--ink); border-radius:999px;
    box-shadow:5px 5px 0 var(--pink), 10px 10px 0 var(--ink);
    transform:rotate(-2deg);
    transition:transform .18s cubic-bezier(.2,1.6,.4,1);
  }
  a.sticker:hover{ transform:rotate(1.5deg) scale(1.1) }
  @media (prefers-reduced-motion:reduce){ .rays,h1{animation:none} }
</style>
</head>
<body>
  <div class="rays" aria-hidden="true"></div>

  <main id="soon" hidden>
    <h1>RSVP<br>opens<br>soon</h1>
    <p>🫧 hold your bubbles — the link isn’t ready yet 🫧</p>
    <a class="sticker" href="../">back to the party</a>
  </main>

  <main id="going" hidden>
    <h1>off you<br>go!!</h1>
    <p>whisking you to the RSVP…</p>
    <a class="sticker" id="goingLink" href="../">tap here if nothing happens</a>
  </main>

  <script>
    if (RSVP_URL) {
      document.getElementById('going').hidden = false;
      document.getElementById('goingLink').href = RSVP_URL;
      location.replace(RSVP_URL);
    } else {
      document.getElementById('soon').hidden = false;
    }
  </script>
  <noscript>
    <main>
      <h1>RSVP</h1>
      <p>enable JavaScript, or head back to <a href="../">the party</a>.</p>
    </main>
  </noscript>
</body>
</html>
